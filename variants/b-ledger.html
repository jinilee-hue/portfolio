<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B · Spec Ledger — 이진희 포트폴리오 시안</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#0C0D0B; --surface:#141613; --line:#2A2E27; --line-2:#3D4239;
    --fg:#E6E8E1; --fg-60:rgba(230,232,225,.6); --fg-35:rgba(230,232,225,.35);
    --acid:#C6F24E; --acid-ink:#0C0D0B;
    --disp:'Bricolage Grotesque',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --sans:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#F2F3EF;--surface:#FFF;--line:#D6D9CF;--line-2:#B9BEB0;
      --fg:#14160F;--fg-60:rgba(20,22,15,.62);--fg-35:rgba(20,22,15,.4);
      --acid:#4B6B00;--acid-ink:#FFF;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6}
  a{color:inherit}
  .wrap{max-width:1320px;margin:0 auto;padding:0 clamp(14px,2.6vw,32px)}
  .mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}

  /* 상단 고정 바 — 시스템 헤더처럼 */
  .top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line-2)}
  .top .wrap{display:flex;align-items:center;gap:14px;height:46px}
  .top .id{font-family:var(--disp);font-weight:800;letter-spacing:-.02em;font-size:15px}
  .top .dot{width:7px;height:7px;background:var(--acid);border-radius:50%;flex:none}
  .top .sp{flex:1}
  .top a,.top button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    text-decoration:none;color:var(--fg-60);background:none;border:0;cursor:pointer;padding:6px 8px}
  .top a:hover,.top button:hover{color:var(--acid)}
  .top button[aria-pressed=true]{color:var(--acid-ink);background:var(--acid)}
  .top a:focus-visible,.top button:focus-visible{outline:2px solid var(--acid);outline-offset:1px}

  /* 히어로: 표제 + 즉시 데이터 */
  .hero{border-bottom:1px solid var(--line-2);padding:clamp(36px,6vw,72px) 0 0}
  h1{font-family:var(--disp);font-weight:800;font-size:clamp(2.1rem,6.4vw,4.9rem);line-height:.95;
    letter-spacing:-.038em;margin:0 0 20px;max-width:19ch;text-wrap:balance;
    word-break:keep-all;overflow-wrap:break-word}
  /* 한글 글리프가 없는 라틴 그로테스크 → 본문 서체로 폴백 지정 */
  :lang(ko) h1{font-family:var(--sans);font-weight:800;letter-spacing:-.04em;line-height:1.06}
  :lang(ko) .nm,:lang(ko) .h2,:lang(ko) .prin h3{font-family:var(--sans);font-weight:600;
    letter-spacing:-.02em;word-break:keep-all}
  :lang(ko) .desc,:lang(ko) .prin p{word-break:keep-all}
  h1 mark{background:none;color:var(--acid)}
  .heroGrid{display:grid;gap:clamp(20px,3vw,40px);align-items:end}
  @media(min-width:900px){.heroGrid{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
  .heroGrid p{margin:0 0 22px;color:var(--fg-60);max-width:50ch}
  .facts{border:1px solid var(--line-2);border-bottom:0;margin-bottom:-1px}
  .facts div{display:flex;justify-content:space-between;gap:16px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .facts dt{margin:0;color:var(--fg-35);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .facts dd{margin:0;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
  .facts dd b{color:var(--acid);font-weight:500}

  /* 필터 */
  .filters{display:flex;flex-wrap:wrap;gap:6px;padding:16px 0;border-bottom:1px solid var(--line-2)}
  .filters button{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
    background:none;border:1px solid var(--line-2);color:var(--fg-60);padding:5px 11px;cursor:pointer;
    transition:all .16s var(--ease)}
  .filters button:hover{border-color:var(--acid);color:var(--fg)}
  .filters button[aria-pressed=true]{background:var(--acid);color:var(--acid-ink);border-color:var(--acid)}
  .filters button:active{transform:translateY(1px)}
  .filters button:focus-visible{outline:2px solid var(--acid);outline-offset:2px}

  /* 원장(ledger) 표 — 카드 대신 행 */
  .ledger{width:100%;border-collapse:collapse}
  .ledger thead th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--fg-35);text-align:left;font-weight:400;padding:10px 12px;border-bottom:1px solid var(--line-2);
    position:sticky;top:46px;background:var(--bg);z-index:5}
  .ledger td{border-bottom:1px solid var(--line);padding:14px 12px;vertical-align:top}
  .ledger tbody tr{transition:background-color .18s var(--ease)}
  .ledger tbody tr:hover{background:var(--surface)}
  .ledger tbody tr:hover .idx{color:var(--acid)}
  .idx{font-family:var(--mono);font-size:12px;color:var(--fg-35);font-variant-numeric:tabular-nums;width:3.5rem}
  .nm{font-family:var(--disp);font-weight:600;font-size:clamp(1rem,1.7vw,1.28rem);letter-spacing:-.015em;
    line-height:1.2;display:block;text-decoration:none}
  .nm:hover{text-decoration:underline;text-decoration-color:var(--acid);text-underline-offset:4px}
  .nm:focus-visible{outline:2px solid var(--acid);outline-offset:3px}
  .desc{color:var(--fg-60);font-size:13.5px;margin:6px 0 0;max-width:64ch}
  .kv{font-family:var(--mono);font-size:11px;color:var(--fg-35);letter-spacing:.03em;white-space:nowrap}
  .stack span{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
    border:1px solid var(--line-2);padding:1.5px 6px;margin:0 4px 4px 0;color:var(--fg-60)}
  .go{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    text-decoration:none;border:1px solid var(--line-2);padding:5px 10px;display:inline-block;white-space:nowrap}
  .go:hover{background:var(--acid);color:var(--acid-ink);border-color:var(--acid)}
  .go:focus-visible{outline:2px solid var(--acid);outline-offset:2px}
  .shotcell{width:184px}
  .shotcell img{width:184px;aspect-ratio:16/10;object-fit:cover;object-position:top center;
    border:1px solid var(--line);display:block;filter:saturate(.35) contrast(1.05);transition:filter .35s var(--ease)}
  tr:hover .shotcell img{filter:none}
  @media(max-width:920px){
    .ledger thead{display:none}
    .ledger,.ledger tbody,.ledger tr,.ledger td{display:block;width:auto}
    .ledger tr{border-bottom:1px solid var(--line-2);padding:6px 0}
    .ledger td{border:0;padding:4px 0}
    .shotcell,.shotcell img{width:100%}
    .idx{width:auto}
  }

  section{padding:clamp(44px,7vw,84px) 0}
  .h2{font-family:var(--disp);font-weight:800;font-size:clamp(1.4rem,3vw,2rem);letter-spacing:-.025em;
    margin:0 0 4px}
  .rulehead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    border-bottom:1px solid var(--line-2);padding-bottom:10px;margin-bottom:20px}
  .prin{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
  @media(min-width:840px){.prin{grid-template-columns:repeat(2,1fr)}}
  .prin article{background:var(--bg);padding:20px}
  .prin h3{font-family:var(--disp);font-weight:600;font-size:1.08rem;margin:0 0 8px;letter-spacing:-.012em}
  .prin h3::before{content:attr(data-n);font-family:var(--mono);font-size:11px;color:var(--acid);
    margin-right:9px;letter-spacing:.06em}
  .prin p{margin:0;color:var(--fg-60);font-size:13.6px}
  footer{border-top:1px solid var(--line-2);padding:26px 0 56px;color:var(--fg-35);font-size:12.5px}
  footer .colo{max-width:62ch;line-height:1.65;margin:0 0 12px;font-family:var(--mono);font-size:11.5px;letter-spacing:.02em}
  .skip{position:absolute;left:-9999px}
  .skip:focus{left:10px;top:10px;z-index:99;background:var(--acid);color:var(--acid-ink);padding:9px 13px}
</style>
</head>
<body>
<a class="skip" href="#work">본문으로 건너뛰기</a>
<div class="top"><div class="wrap">
  <span class="dot" aria-hidden="true"></span>
  <span class="id">JINHEE LEE</span>
  <span class="mono" style="color:var(--fg-35)">AI PRODUCT DESIGNER</span>
  <span class="sp"></span>
  <a href="#work">WORK</a><a href="#principles">PRINCIPLES</a>
  <a href="https://github.com/jinilee-hue">GITHUB</a>
  <button type="button" data-lang="ko" aria-pressed="true">KO</button>
  <button type="button" data-lang="en" aria-pressed="false">EN</button>
</div></div>

<main>
<div class="hero"><div class="wrap heroGrid">
  <div><h1 id="h1"></h1><p id="lede"></p></div>
  <dl class="facts" id="facts"></dl>
</div></div>

<div class="wrap">
  <section id="work" style="padding-top:0">
    <div class="filters" id="filters" role="group" aria-label="스택 필터"></div>
    <table class="ledger">
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>

  <section id="principles">
    <div class="rulehead"><h2 class="h2" id="prin-h"></h2><span class="mono" style="color:var(--fg-35)">04 ITEMS</span></div>
    <div class="prin" id="prin"></div>
  </section>
</div>
</main>

<footer><div class="wrap">
  <p class="colo" id="colophon"></p>
  <a href="https://github.com/jinilee-hue" style="color:var(--fg-60)">github.com/jinilee-hue</a>
</div></footer>

<script type="module">
import { loadProjects, pick, lang, setLang, onRender, fmtDate } from './shared.js';

const COPY={
  ko:{
    h1:'시안이 아니라 <mark>열리는 주소</mark>를 낸다.',
    lede:'EduPoly에서 교육 제품을 설계한다. 아래 목록은 전부 GitHub Pages에 실제로 배포되어 지금 열리는 화면이고, 이 표는 GitHub API에서 매일 자동으로 다시 채워진다.',
    facts:[['소속','AI Product Designer / EduPoly'],['배포 프로토타입','<b>{n}</b>개'],['라이브 비율','<b>{live}</b>'],['최근 갱신','{last}'],['주 도구','Claude Code / Midjourney / Kling']],
    cols:['#','프로젝트','스택','갱신','','링크'],
    all:'전체',
    prinH:'작업 원칙',
    prin:[
      ['AI는 초안을 늘리는 도구','한 방향을 빨리 뽑으려 쓰지 않는다. 같은 시간에 검토할 방향의 수를 늘리려 쓴다. 고르는 일은 위임하지 않는다.'],
      ['판단이 필요하면 눌러볼 수 있게','정지 이미지는 클릭 후를 설명하지 못한다. 결정을 요구하는 화면은 동작하는 프로토타입으로 회의에 올린다.'],
      ['토큰이 먼저, 화면은 그다음','대시보드 두 개가 브랜드만 바꿔 같은 뼈대를 쓴 이유. 색과 타입이 화면이 아니라 토큰에 적혀 있었다.'],
      ['AI를 멈추는 선','최종 카피·브랜드 판단·접근성 검증은 직접 한다. 생성물이 90% 맞을 때 남은 10%를 잡아내는 게 일이다.'],
    ],
    colophon:'BUILT WITH CLAUDE CODE. 기본 제안값(INTER · 인디고 그래디언트 · 3단 카드)은 전부 폐기. 데이터 갱신: GITHUB ACTIONS 매일 06:00 KST.',
  },
  en:{
    h1:'I ship <mark>URLs</mark>, not mockups.',
    lede:'Product designer at EduPoly. Everything listed below is deployed on GitHub Pages and opens right now; this table refills itself daily from the GitHub API.',
    facts:[['Role','AI Product Designer / EduPoly'],['Shipped prototypes','<b>{n}</b>'],['Live ratio','<b>{live}</b>'],['Last update','{last}'],['Primary tools','Claude Code / Midjourney / Kling']],
    cols:['#','Project','Stack','Updated','','Link'],
    all:'All',
    prinH:'How I work',
    prin:[
      ['AI widens the draft','Not a shortcut to one direction — a way to review more directions per hour. Choosing is never delegated.'],
      ['If it needs a decision, make it pressable','A still image can\'t answer what happens on click. Decision-bearing screens go into the room as working prototypes.'],
      ['Tokens first, screens second','Why two dashboards shared one skeleton across brands: color and type lived in tokens, not in screens.'],
      ['Where AI stops','Final copy, brand judgment and accessibility checks stay manual. Catching the last 10% is the job.'],
    ],
    colophon:'BUILT WITH CLAUDE CODE. ITS DEFAULTS (INTER · INDIGO GRADIENT · THREE-CARD GRID) WERE DISCARDED. DATA REFRESH: GITHUB ACTIONS, DAILY 06:00 KST.',
  }
};

let DATA=null, filter='*';

function draw(){
  const L=lang(), c=COPY[L];
  document.documentElement.lang=L;
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===L)));
  h1.innerHTML=c.h1; lede.textContent=c.lede;

  const ps=DATA.projects.map(pick);
  const live=ps.filter(p=>p.live).length;
  const last=fmtDate(DATA.projects.map(p=>p.auto.pushed_at).sort().at(-1),L);
  facts.innerHTML=c.facts.map(([k,v])=>`<div><dt>${k}</dt><dd>${
    v.replace('{n}',ps.length).replace('{live}',live+'/'+ps.length).replace('{last}',last)}</dd></div>`).join('');

  const langs=[...new Set(ps.flatMap(p=>p.langs))].slice(0,7);
  filters.innerHTML=[['*',c.all],...langs.map(l=>[l,l])].map(([v,t])=>
    `<button type="button" data-f="${v}" aria-pressed="${filter===v}">${t}</button>`).join('');
  filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;draw();});

  thead.innerHTML=c.cols.map(x=>`<th scope="col">${x}</th>`).join('');
  const shown=ps.filter(p=>filter==='*'||p.langs.includes(filter));
  tbody.innerHTML=shown.map((p,i)=>`
    <tr>
      <td class="idx">${String(i+1).padStart(2,'0')}</td>
      <td>
        <a class="nm" href="${p.live||p.repo}" target="_blank" rel="noopener">${p.title}</a>
        ${p.kicker?`<div class="kv" style="margin-top:5px">${p.kicker}</div>`:''}
        <p class="desc">${p.summary}</p>
      </td>
      <td class="stack">${p.tags.slice(0,4).map(x=>`<span>${x}</span>`).join('')}</td>
      <td class="kv">${p.pushed}</td>
      <td class="shotcell"><img src="${p.shot}" alt="${p.title} 실제 화면" loading="lazy" width="184" height="115"></td>
      <td><a class="go" href="${p.live||p.repo}" target="_blank" rel="noopener">OPEN ↗</a></td>
    </tr>`).join('');

  document.getElementById('prin-h').textContent=c.prinH;
  prin.innerHTML=c.prin.map(([h,b],i)=>`<article><h3 data-n="${String(i+1).padStart(2,'0')}">${h}</h3><p>${b}</p></article>`).join('');
  colophon.textContent=c.colophon;
}
onRender(draw);
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
loadProjects().then(d=>{DATA=d;draw();}).catch(e=>{tbody.innerHTML='<tr><td>데이터 로드 실패: '+e.message+'</td></tr>';});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A · Editorial Ink — 이진희 포트폴리오 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EE; --paper-2:#EFEAE1; --ink:#17140F; --ink-60:rgba(23,20,15,.62);
    --ink-30:rgba(23,20,15,.28); --rule:rgba(23,20,15,.16); --accent:#7C2D18;
    --serif:'Instrument Serif',ui-serif,Georgia,serif;
    --sans:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  @media (prefers-color-scheme:dark){
    :root{--paper:#131210;--paper-2:#1B1A17;--ink:#EDE9E1;--ink-60:rgba(237,233,225,.62);
      --ink-30:rgba(237,233,225,.3);--rule:rgba(237,233,225,.16);--accent:#E2724A;}
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.65;font-feature-settings:"ss01";text-rendering:optimizeLegibility}
  a{color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,64px)}

  /* ── 상단 바 ─────────────────────────────── */
  .bar{display:flex;justify-content:space-between;align-items:baseline;gap:24px;
    padding:22px 0;border-bottom:1px solid var(--rule)}
  .sig{font-family:var(--serif);font-size:20px;letter-spacing:.01em}
  .bar nav{display:flex;gap:20px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-60)}
  .bar nav a{text-decoration:none;padding:4px 0;border-bottom:1px solid transparent;transition:border-color .18s var(--ease),color .18s var(--ease)}
  .bar nav a:hover,.bar nav a:focus-visible{color:var(--ink);border-color:var(--accent)}
  .lang{display:flex;gap:2px;font-size:12px}
  .lang button{font:inherit;background:none;border:0;padding:4px 7px;cursor:pointer;color:var(--ink-30);letter-spacing:.08em}
  .lang button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--accent)}
  .lang button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ── 히어로: 타이포가 곧 레이아웃 ────────────── */
  .hero{padding:clamp(56px,11vw,132px) 0 clamp(40px,7vw,80px);
    display:grid;grid-template-columns:1fr;gap:clamp(28px,4vw,48px)}
  @media(min-width:900px){.hero{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:end}}
  .claim{font-family:var(--serif);font-weight:400;
    font-size:clamp(2.6rem,7.6vw,6.1rem);line-height:.98;letter-spacing:-.022em;margin:0;
    text-wrap:balance;word-break:keep-all;overflow-wrap:break-word}
  /* 한글엔 라틴 세리프 글리프가 없다 — 본문 서체 + 무게로 위계를 만든다 */
  :lang(ko) .claim{font-family:var(--sans);font-weight:700;letter-spacing:-.038em;line-height:1.04;
    font-size:clamp(2.2rem,6.9vw,5.2rem)}
  :lang(ko) .claim em{font-style:normal;font-weight:800}
  :lang(ko) .sec-head h2,:lang(ko) .row-main h3,:lang(ko) .prin h3{font-family:var(--sans);
    font-weight:600;letter-spacing:-.025em;word-break:keep-all}
  :lang(ko) .strip dd{font-family:var(--sans);font-weight:700}
  :lang(ko) .sig{font-family:var(--sans);font-weight:700}
  .claim em{font-style:italic;color:var(--accent)}
  .claim .r{display:block;overflow:hidden}
  .claim .r>span{display:block;transform:translateY(102%);animation:rise .9s var(--ease) forwards}
  .claim .r:nth-child(2)>span{animation-delay:.07s}
  .claim .r:nth-child(3)>span{animation-delay:.14s}
  @keyframes rise{to{transform:translateY(0)}}
  @media(prefers-reduced-motion:reduce){.claim .r>span{transform:none;animation:none}}
  .lede{font-size:clamp(1rem,1.35vw,1.13rem);color:var(--ink-60);max-width:44ch;margin:0}
  .lede strong{color:var(--ink);font-weight:600}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:22px;font-size:13px;color:var(--ink-30);
    letter-spacing:.04em}
  .meta-row b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

  /* ── 지표 스트립 ───────────────────────────── */
  .strip{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);
    border-block:1px solid var(--rule);margin-top:clamp(30px,5vw,54px)}
  @media(min-width:760px){.strip{grid-template-columns:repeat(4,1fr)}}
  .strip div{background:var(--paper);padding:18px 20px}
  .strip dt{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-30);margin:0 0 6px}
  .strip dd{margin:0;font-family:var(--serif);font-size:clamp(1.7rem,3.1vw,2.35rem);line-height:1;
    font-variant-numeric:tabular-nums}

  /* ── 인덱스: 카드 그리드가 아니라 에디토리얼 목록 ── */
  section{padding:clamp(56px,9vw,110px) 0}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;
    border-bottom:1px solid var(--ink);padding-bottom:12px;margin-bottom:6px}
  .sec-head h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.5rem,3vw,2.1rem);margin:0;letter-spacing:-.01em}
  .sec-head span{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-30);
    font-variant-numeric:tabular-nums}

  .row{display:grid;grid-template-columns:auto 1fr;gap:0 clamp(16px,3vw,38px);
    padding:clamp(22px,3vw,34px) 0;border-bottom:1px solid var(--rule);
    text-decoration:none;position:relative;transition:background-color .3s var(--ease)}
  @media(min-width:940px){.row{grid-template-columns:4.5rem minmax(0,1fr) minmax(0,20rem)}}
  .row:hover,.row:focus-visible{background:var(--paper-2)}
  .row:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .row:active{background:var(--paper-2);transform:translateY(1px)}
  .num{font-family:var(--serif);font-size:clamp(1.1rem,2vw,1.5rem);color:var(--ink-30);
    font-variant-numeric:tabular-nums;line-height:1.2;padding-top:.15em}
  .row-main h3{font-family:var(--serif);font-weight:400;margin:0 0 .3em;
    font-size:clamp(1.35rem,3.1vw,2.15rem);line-height:1.08;letter-spacing:-.015em;text-wrap:balance}
  .row:hover .row-main h3{color:var(--accent)}
  .kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-30);margin:0 0 .8em}
  .row-main p{margin:0;color:var(--ink-60);max-width:62ch;font-size:.955rem}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .tags span{font-size:11.5px;letter-spacing:.05em;color:var(--ink-60);
    border:1px solid var(--rule);border-radius:2px;padding:2.5px 8px}
  .row-side{display:none}
  @media(min-width:940px){.row-side{display:block}}
  .thumb{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top center;
    border:1px solid var(--rule);filter:grayscale(1) contrast(1.04);
    transition:filter .45s var(--ease);background:var(--paper-2)}
  .row:hover .thumb{filter:grayscale(0) contrast(1)}
  .side-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-30);
    margin-top:8px;letter-spacing:.05em;font-variant-numeric:tabular-nums}

  /* ── 원칙 ─────────────────────────────────── */
  .prin{display:grid;gap:clamp(20px,3vw,34px)}
  @media(min-width:820px){.prin{grid-template-columns:repeat(2,1fr)}}
  .prin article{border-top:1px solid var(--ink);padding-top:16px}
  .prin h3{font-family:var(--serif);font-weight:400;font-size:1.32rem;margin:0 0 .4em;letter-spacing:-.01em}
  .prin p{margin:0;color:var(--ink-60);font-size:.95rem}

  footer{border-top:1px solid var(--ink);padding:34px 0 60px;display:flex;flex-wrap:wrap;
    gap:16px 32px;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-60)}
  footer a{text-underline-offset:3px;text-decoration-color:var(--ink-30)}
  footer a:hover{text-decoration-color:var(--accent);color:var(--ink)}
  .colophon{max-width:52ch;font-size:12.5px;color:var(--ink-30);line-height:1.6}
  .skip{position:absolute;left:-9999px}
  .skip:focus{left:12px;top:12px;z-index:9;background:var(--ink);color:var(--paper);padding:10px 14px}
</style>
</head>
<body>
<a class="skip" href="#work">본문으로 건너뛰기</a>
<div class="wrap">
  <header class="bar">
    <span class="sig">이진희 <span style="color:var(--ink-30)">Jinhee Lee</span></span>
    <nav aria-label="주요">
      <a href="#work" data-i18n="nav-work">작업</a>
      <a href="#principles" data-i18n="nav-prin">원칙</a>
      <a href="https://github.com/jinilee-hue">GitHub</a>
    </nav>
    <div class="lang" role="group" aria-label="언어 선택">
      <button type="button" data-lang="ko" aria-pressed="true">KO</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <main>
  <div class="hero">
    <div>
      <h1 class="claim" id="claim"></h1>
      <div class="meta-row" id="metarow"></div>
    </div>
    <p class="lede" id="lede"></p>
  </div>

  <dl class="strip" id="strip"></dl>

  <section id="work">
    <div class="sec-head">
      <h2 id="work-h"></h2><span id="work-count"></span>
    </div>
    <div id="rows"></div>
  </section>

  <section id="principles">
    <div class="sec-head"><h2 id="prin-h"></h2><span>01 — 04</span></div>
    <div class="prin" id="prin"></div>
  </section>
  </main>

  <footer>
    <div class="colophon" id="colophon"></div>
    <div><a href="https://github.com/jinilee-hue">github.com/jinilee-hue</a></div>
  </footer>
</div>

<script type="module">
import { loadProjects, pick, t, lang, setLang, onRender, fmtDate } from './shared.js';

const COPY = {
  ko:{
    claim:['아이디어에서','<em>배포된 화면</em>까지','혼자 간다.'],
    lede:'EduPoly에서 교육 제품을 설계하는 디자이너. 시안에서 멈추지 않고 <strong>실제로 열리는 주소</strong>까지 만든다. 아래 작업은 전부 지금 브라우저에서 열리는 것들이다.',
    meta:['AI Product Designer · EduPoly','서울'],
    strip:[['배포된 프로토타입','{n}'],['전부 라이브','{live}'],['최근 갱신','{last}'],['주 도구','Claude Code'],],
    workH:'작업', prinH:'작업 원칙',
    prin:[
      ['AI는 초안을 늘리는 도구다','한 방향을 빨리 뽑으려고 쓰지 않는다. 같은 시간에 볼 수 있는 방향의 수를 늘리려고 쓴다. 고르는 일은 위임하지 않는다.'],
      ['시안은 열리는 주소로 낸다','정지 이미지는 클릭했을 때 뭐가 되는지 말해주지 못한다. 판단이 필요한 화면은 실제로 눌러볼 수 있게 만들어서 회의에 가져간다.'],
      ['토큰이 먼저, 화면은 그다음','대시보드 두 개를 브랜드만 바꿔 재사용할 수 있었던 건 색과 타입을 화면이 아니라 토큰에 적어뒀기 때문이다.'],
      ['AI를 쓰지 않는 선을 정해둔다','최종 카피, 브랜드 판단, 접근성 검증은 직접 한다. 생성물이 90% 맞을 때 남은 10%를 알아보는 게 디자이너의 일이다.'],
    ],
    colophon:'이 사이트는 Claude Code로 만들었다. 처음 제안받은 기본값은 Inter · 인디고 그래디언트 · 3단 카드 그리드였고, 전부 버리고 다시 짰다. 프로젝트 목록과 썸네일은 GitHub API에서 매일 자동으로 갱신된다.',
  },
  en:{
    claim:['From idea to a','<em>shipped screen</em>,','on my own.'],
    lede:'A product designer at EduPoly. I don\'t stop at mockups — I ship <strong>URLs that actually open</strong>. Everything below is live in your browser right now.',
    meta:['AI Product Designer · EduPoly','Seoul'],
    strip:[['Shipped prototypes','{n}'],['All live','{live}'],['Last update','{last}'],['Primary tool','Claude Code']],
    workH:'Selected work', prinH:'How I work',
    prin:[
      ['AI widens the draft, not the shortcut','I don\'t use it to reach one direction faster. I use it to see more directions in the same hour. Choosing is never delegated.'],
      ['Ship the study as a URL','A still image can\'t answer what happens on click. Anything that needs a decision goes into the room as something you can press.'],
      ['Tokens first, screens second','Two dashboards reused the same skeleton across brands because color and type lived in tokens, not in the screens.'],
      ['Know where AI stops','Final copy, brand judgment and accessibility checks stay manual. When a generation is 90% right, spotting the last 10% is the job.'],
    ],
    colophon:'Built with Claude Code. Its first defaults were Inter, an indigo gradient and a three-card grid — all discarded. The project list and thumbnails refresh daily from the GitHub API.',
  }
};

let DATA = null;

function draw(){
  const L = lang(), c = COPY[L];
  document.documentElement.lang = L;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.lang===L)));

  claim.innerHTML = c.claim.map(r=>`<span class="r"><span>${r}</span></span>`).join('');
  lede.innerHTML = c.lede;
  metarow.innerHTML = c.meta.map(m=>`<span>${m}</span>`).join('');

  const ps = DATA.projects.map(pick);
  const live = ps.filter(p=>p.live).length;
  const last = fmtDate(DATA.projects.map(p=>p.auto.pushed_at).sort().at(-1), L);
  strip.innerHTML = c.strip.map(([k,v])=>`<div><dt>${k}</dt><dd>${
    v.replace('{n}',ps.length).replace('{live}',live+'/'+ps.length).replace('{last}',last)}</dd></div>`).join('');

  document.getElementById('work-h').textContent = c.workH;
  document.getElementById('work-count').textContent = `01 — ${String(ps.length).padStart(2,'0')}`;

  rows.innerHTML = ps.map((p,i)=>`
    <a class="row" href="${p.live||p.repo}" target="_blank" rel="noopener">
      <div class="num">${String(i+1).padStart(2,'0')}</div>
      <div class="row-main">
        ${p.kicker?`<p class="kicker">${p.kicker}</p>`:''}
        <h3>${p.title}</h3>
        <p>${p.summary}</p>
        <div class="tags">${p.tags.slice(0,4).map(x=>`<span>${x}</span>`).join('')}</div>
      </div>
      <div class="row-side">
        <img class="thumb" src="../${p.shot}" alt="${p.title} 실제 화면" loading="lazy" width="640" height="400">
        <div class="side-meta"><span>${p.langs.slice(0,2).join(' · ')}</span><span>${p.pushed}</span></div>
      </div>
    </a>`).join('');

  document.getElementById('prin-h').textContent = c.prinH;
  prin.innerHTML = c.prin.map(([h,b])=>`<article><h3>${h}</h3><p>${b}</p></article>`).join('');
  colophon.textContent = c.colophon;
}

onRender(draw);
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
loadProjects().then(d=>{DATA=d;draw();}).catch(e=>{document.getElementById('rows').textContent='데이터를 불러오지 못했습니다: '+e.message;});
</script>
</body>
</html>

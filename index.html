<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이진희 — AI Product Designer · Portfolio</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Archivo:wdth,wght@75..125,400;75..125,600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A; --fg:#F2F0EC; --fg-55:rgba(242,240,236,.55); --fg-28:rgba(242,240,236,.28);
    --line:rgba(242,240,236,.13); --accent:#00E5C0;
    --disp:'Fraunces',ui-serif,Georgia,serif;
    --grot:'Archivo',system-ui,sans-serif;
    --sans:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
    --ease:cubic-bezier(.19,1,.22,1);
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#FAFAF8;--fg:#0D0D0C;--fg-55:rgba(13,13,12,.58);--fg-28:rgba(13,13,12,.32);
      --line:rgba(13,13,12,.14);--accent:#00776A;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.6;
    overflow-x:hidden}
  /* 고정 헤더가 스크롤 목적지를 가리지 않도록 (WCAG 2.4.11 Focus Not Obscured) */
  :where(h2,h3,.case,.band,[id]){scroll-margin-top:72px}
  a{color:inherit}
  .wrap{max-width:1500px;margin:0 auto;padding:0 clamp(16px,4vw,56px)}

  header{position:fixed;top:0;left:0;right:0;z-index:30;mix-blend-mode:difference;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:18px clamp(16px,4vw,56px);color:#fff;pointer-events:none}
  /* 모바일: 좁은 폭에서 이름과 내비가 겹치고 본문 위에 올라탄다.
     흐름에 맞춰 두 줄로 내리고, blend mode 대신 배경을 깔아 가독성을 확보한다. */
  @media(max-width:720px){
    header{position:static;mix-blend-mode:normal;flex-wrap:wrap;gap:6px 10px;
      color:var(--fg);background:var(--bg);border-bottom:1px solid var(--line);
      padding:12px clamp(16px,4vw,56px)}
    header .mark{flex:1 0 100%;font-size:15px}
    header nav{flex-wrap:wrap;margin-left:-9px}
    header a,header button{color:var(--fg);opacity:.75;font-size:10.5px;padding:5px 9px}
  }
  header *{pointer-events:auto}
  .mark{font-family:var(--disp);font-weight:600;font-size:17px;letter-spacing:-.01em}
  header nav{display:flex;gap:6px;align-items:center}
  header a,header button{font-family:var(--grot);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
    text-decoration:none;color:#fff;background:none;border:0;cursor:pointer;padding:6px 9px;opacity:.7}
  header a:hover,header button:hover{opacity:1}
  header button[aria-pressed=true]{opacity:1;text-decoration:underline;text-underline-offset:4px}
  header a:focus-visible,header button:focus-visible{outline:2px solid #fff;outline-offset:2px;opacity:1}

  /* 히어로 — 화면이 주인공, 타입은 위에 얹힌다 */
  .open{min-height:92svh;display:flex;flex-direction:column;justify-content:flex-end;
    padding:120px 0 clamp(28px,4vw,56px);position:relative}
  .kick{font-family:var(--grot);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--disp);font-weight:300;font-variation-settings:'opsz' 120;
    font-size:clamp(2.5rem,8.4vw,7.2rem);line-height:.94;letter-spacing:-.028em;margin:0;max-width:16ch;
    text-wrap:balance;word-break:keep-all;overflow-wrap:break-word}
  /* 한글은 라틴 디스플레이 서체에 글리프가 없어 명조로 폴백된다 — 본문 서체로 되돌리고 무게로 대비를 만든다 */
  :lang(ko) h1{font-family:var(--sans);font-weight:600;letter-spacing:-.035em;line-height:1.02;
    font-size:clamp(2.2rem,7.2vw,5.9rem)}
  :lang(ko) h1 i{font-weight:800}
  :lang(ko) .info h2,:lang(ko) .band h2{font-family:var(--sans);font-weight:600;letter-spacing:-.028em;
    word-break:keep-all}
  :lang(ko) .counts dd{font-family:var(--sans);font-weight:600}
  :lang(ko) .mark{font-family:var(--sans);font-weight:700}
  h1 i{font-weight:600;font-style:normal;color:var(--accent)}
  .openfoot{display:flex;flex-wrap:wrap;gap:20px 48px;align-items:end;justify-content:space-between;
    margin-top:clamp(28px,4vw,52px);border-top:1px solid var(--line);padding-top:20px}
  .openfoot p{margin:0;max-width:42ch;color:var(--fg-55);font-size:.96rem}
  .counts{display:flex;gap:clamp(20px,3vw,44px)}
  .counts div{white-space:nowrap}
  .counts dt{font-family:var(--grot);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--fg-28);margin:0 0 4px}
  .counts dd{margin:0;font-family:var(--disp);font-size:clamp(1.6rem,3vw,2.4rem);line-height:1;
    font-variant-numeric:tabular-nums}

  /* 작업 — 전면 스크린샷 스택, 홀짝 어긋나게 */
  .room{padding:clamp(40px,7vw,90px) 0}
  .piece{display:grid;gap:clamp(14px,2vw,28px);margin-bottom:clamp(46px,8vw,120px);
    grid-template-columns:1fr;text-decoration:none;position:relative}
  @media(min-width:920px){
    .piece{grid-template-columns:repeat(12,1fr);align-items:center}
    .piece .shot{grid-column:1/9}
    .piece .info{grid-column:9/13}
    .piece:nth-child(even) .shot{grid-column:5/13;grid-row:1}
    .piece:nth-child(even) .info{grid-column:1/5;grid-row:1}
    /* 3n 번째는 리듬을 위해 폭을 살짝 좁히되, shot 과 info 열이 겹치지 않게 한 행에 나눠 둔다
       (겹치면 스크린샷 위로 텍스트가 올라타 화면이 잘려 보인다). */
    .piece:nth-child(3n) .shot{grid-column:1/8;grid-row:1}
    .piece:nth-child(3n) .info{grid-column:8/13;grid-row:1}
  }
  .shot{position:relative;overflow:hidden;aspect-ratio:1440/900;
    background:color-mix(in oklab, var(--fg) 6%, transparent);border:1px solid var(--line)}
  .shot img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;
    transform:scale(1.005);transition:transform .8s var(--ease),filter .6s var(--ease);
    filter:saturate(.9) brightness(1.06)}
  .piece:hover .shot img{transform:scale(1.045);filter:saturate(1.05) brightness(1.12)}
  .shot::after{content:attr(data-open);position:absolute;left:14px;bottom:14px;
    font-family:var(--grot);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    background:var(--accent);color:#04120F;padding:6px 11px;opacity:0;transform:translateY(6px);
    transition:opacity .3s var(--ease),transform .3s var(--ease)}
  .piece:hover .shot::after,.piece:focus-visible .shot::after{opacity:1;transform:translateY(0)}
  .piece:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
  .piece:active .shot img{transform:scale(1.02)}
  .n{font-family:var(--grot);font-size:10.5px;letter-spacing:.15em;color:var(--fg-28);
    display:block;margin-bottom:10px;font-variant-numeric:tabular-nums}
  .info h2{font-family:var(--disp);font-weight:300;font-variation-settings:'opsz' 90;
    font-size:clamp(1.5rem,3.4vw,2.5rem);line-height:1.06;letter-spacing:-.02em;margin:0 0 .45em;text-wrap:balance}
  .piece:hover .info h2{color:var(--accent)}
  .info p{margin:0;color:var(--fg-55);font-size:.93rem;max-width:46ch}
  .info .role{font-family:var(--grot);font-size:11px;letter-spacing:.06em;color:var(--fg-28);
    margin-top:12px;display:block}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .chips span{display:inline-flex;align-items:center;gap:6px;
    font-family:var(--grot);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--fg-55);border:1px solid var(--line);padding:5px 10px 5px 8px;border-radius:999px;
    transition:border-color .2s var(--ease),color .2s var(--ease)}
  .chips span:hover{border-color:var(--accent);color:var(--fg)}
  .chips .ic{width:12px;height:12px;opacity:.75;color:var(--accent)}

  /* ── 케이스 스터디 상세 ─────────────────────────── */
  .meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:12px;
    font-family:var(--grot);font-size:11px;letter-spacing:.06em;color:var(--fg-28)}
  .meta b{color:var(--fg-55);font-weight:400;font-variant-numeric:tabular-nums}
  .more{margin-top:20px;font-family:var(--grot);font-weight:600;font-size:13px;letter-spacing:.04em;
    background:var(--accent);border:1px solid var(--accent);color:#fff;
    padding:12px 22px;cursor:pointer;transition:all .2s var(--ease);
    display:inline-flex;align-items:center;gap:10px;min-height:44px}
  /* 셰브론(v) — 글리프 대신 도형으로 그려 서체에 흔들리지 않게 */
  .more .chev{width:9px;height:9px;border-right:1.8px solid currentColor;
    border-bottom:1.8px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);
    transition:transform .25s var(--ease)}
  .more:hover{filter:brightness(1.1)}
  .more:active{transform:translateY(1px)}
  .more:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
  .more[aria-expanded=true]{background:transparent;color:var(--accent)}
  .more[aria-expanded=true] .chev{transform:rotate(-135deg) translate(-3px,-3px)}
  .case{display:none;grid-column:1/-1;border-top:1px solid var(--line);margin-top:clamp(20px,3vw,34px);
    padding-top:clamp(22px,3vw,34px)}
  .case.open{display:grid;gap:clamp(22px,3vw,40px);align-items:start}
  @media(min-width:900px){.case.open{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
  .case>div>*:last-child{margin-bottom:0}
  .case h3{font-family:var(--grot);font-weight:600;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);margin:0 0 10px}
  .case p{margin:0 0 18px;color:var(--fg-55);font-size:.92rem;max-width:60ch;word-break:keep-all}
  /* 플로우 차트 — 단계 노드를 연결선으로 잇는다.
     넓은 화면은 가로 흐름, 좁은 화면은 세로 흐름으로 자동 전환. */
  .flow{list-style:none;margin:0 0 22px;padding:0;display:flex;flex-wrap:wrap;gap:0}
  .flow li{position:relative;flex:1 1 128px;min-width:118px;
    border:1px solid var(--line);padding:11px 12px 12px;margin:0 14px 14px 0;
    background:color-mix(in oklab, var(--fg) 3%, transparent)}
  .flow li .s{display:block;font-family:var(--grot);font-size:9.5px;letter-spacing:.14em;
    color:var(--accent);font-variant-numeric:tabular-nums;margin-bottom:6px}
  .flow li .t{display:block;font-size:.83rem;line-height:1.45;color:var(--fg-55);word-break:keep-all}
  /* 노드 사이 연결선 + 화살촉 */
  .flow li::after{content:'';position:absolute;top:50%;right:-14px;width:14px;height:1px;
    background:var(--line)}
  .flow li::before{content:'';position:absolute;top:50%;right:-14px;
    border:3px solid transparent;border-left-color:var(--fg-28);
    transform:translate(9px,-3px)}
  .flow li:last-child::after,.flow li:last-child::before,
  .flow li.row-end::after,.flow li.row-end::before{display:none}
  /* 줄바꿈된 노드의 연결선은 지운다(허공을 가리키게 되므로) */
  @media(max-width:1100px){
    .flow{flex-direction:column}
    .flow li{flex:none;margin:0 0 16px}
    .flow li::after{top:auto;bottom:-16px;right:auto;left:18px;width:1px;height:16px}
    .flow li::before{top:auto;bottom:-16px;right:auto;left:18px;
      border-left-color:transparent;border-top-color:var(--fg-28);transform:translate(-3px,10px)}
  }
  .stack{margin:0 0 20px}
  .stack div{display:grid;grid-template-columns:5.5rem 1fr;gap:10px;padding:7px 0;
    border-bottom:1px solid var(--line);align-items:baseline}
  .stack dt{font-family:var(--grot);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--fg-28);margin:0}
  .stack dd{margin:0;font-size:.88rem;color:var(--fg-55)}
  .dec{list-style:none;margin:0;padding:0}
  .dec li{position:relative;padding:0 0 14px 18px;color:var(--fg-55);font-size:.9rem;
    max-width:58ch;word-break:keep-all}
  .dec li::before{content:'';position:absolute;left:0;top:.62em;width:6px;height:1px;background:var(--accent)}

  /* ── 데이터 시각화 ────────────────────────────────
     모든 수치는 GitHub API 에서 온 실제 값이다. 장식용 가짜 숫자는 쓰지 않는다. */

  /* 1) 타임라인 — 14개 프로젝트의 실제 작업 구간 */
  .tl{border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:clamp(24px,4vw,40px) 0;margin-top:clamp(28px,4vw,48px)}
  .tl-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:20px}
  .tl-head h2{font-family:var(--grot);font-weight:600;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);margin:0}
  .tl-head span{font-family:var(--grot);font-size:10.5px;letter-spacing:.1em;color:var(--fg-28);
    font-variant-numeric:tabular-nums}
  .tl-axis{display:flex;justify-content:space-between;font-family:var(--grot);font-size:10px;
    letter-spacing:.08em;color:var(--fg-28);border-bottom:1px solid var(--line);
    padding-bottom:6px;margin-bottom:10px;font-variant-numeric:tabular-nums}
  .tl-row{display:grid;grid-template-columns:minmax(84px,1.1fr) minmax(0,4fr);gap:12px;
    align-items:center;padding:3px 0}
  .tl-row b{font-size:10.5px;font-weight:400;color:var(--fg-55);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;font-family:var(--grot);letter-spacing:.02em}
  .tl-track{position:relative;height:11px;background:color-mix(in oklab,var(--fg) 5%,transparent)}
  .tl-bar{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.5;
    transition:opacity .25s var(--ease)}
  .tl-row:hover .tl-bar{opacity:1}
  .tl-row:hover b{color:var(--fg)}

  /* 2) 언어 구성 막대 — 저장소 바이트 비율 */
  .langbar{display:flex;height:5px;margin:12px 0 8px;overflow:hidden;
    background:color-mix(in oklab,var(--fg) 6%,transparent)}
  .langbar i{display:block;height:100%}
  .langkey{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--grot);font-size:10px;
    letter-spacing:.05em;color:var(--fg-28)}
  .langkey span{display:inline-flex;align-items:center;gap:5px}
  .langkey em{width:7px;height:7px;font-style:normal;flex:none}

  /* 3) 규모 지표 — 커밋 수를 막대로 */
  .gauge{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;
    font-family:var(--grot);font-size:10px;letter-spacing:.08em;color:var(--fg-28);margin-top:8px}
  .gauge .g{height:4px;background:color-mix(in oklab,var(--fg) 8%,transparent);position:relative}
  .gauge .g i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.75}
  .gauge b{color:var(--fg-55);font-weight:400;font-variant-numeric:tabular-nums}

  /* 4) 아이콘 — 메타 항목 식별용, 도형으로만 그린다 */
  .ic{width:11px;height:11px;flex:none;opacity:.5;stroke:currentColor;fill:none;stroke-width:1.6}
  .meta span{display:inline-flex;align-items:center;gap:5px}

  .band{border-top:1px solid var(--line);padding:clamp(48px,8vw,100px) 0}
  .band h2{font-family:var(--disp);font-weight:300;font-size:clamp(1.6rem,4vw,2.8rem);
    letter-spacing:-.02em;margin:0 0 clamp(24px,3vw,44px);max-width:20ch}
  .prin{display:grid;gap:clamp(22px,3vw,44px)}
  @media(min-width:900px){.prin{grid-template-columns:repeat(2,1fr)}}
  .prin article{border-top:1px solid var(--line);padding-top:14px}
  .prin h3{font-family:var(--grot);font-weight:600;font-size:.95rem;letter-spacing:.01em;margin:0 0 8px}
  .prin p{margin:0;color:var(--fg-55);font-size:.92rem}
  footer{border-top:1px solid var(--line);padding:30px 0 64px;color:var(--fg-28);font-size:12.5px;
    display:flex;flex-wrap:wrap;gap:14px 36px;justify-content:space-between;align-items:baseline}
  footer .colo{max-width:56ch;line-height:1.65}
  .skip{position:absolute;left:-9999px}
  .skip:focus{left:12px;top:12px;z-index:99;background:var(--accent);color:#04120F;padding:10px 14px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ── 인쇄 / PDF 저장 ──────────────────────────────
     브라우저의 '대상: PDF로 저장' 으로 벡터 텍스트 PDF 가 나온다.
     화면용 다크 테마를 흰 종이로 뒤집고, 케이스 스터디는 전부 펼쳐 인쇄한다. */
  @media print{
    @page{size:A4;margin:14mm 12mm}
    :root{--bg:#fff;--fg:#000;--fg-55:#3a3a3a;--fg-28:#6a6a6a;--line:#c9c9c9;--accent:#00655a}
    html,body{background:#fff!important;color:#000!important}
    header,.no-print{display:none!important}
    .wrap{max-width:none;padding:0}
    .open{min-height:auto;padding:0 0 8mm;page-break-after:auto;
      border-bottom:1px solid #ddd;margin-bottom:7mm}
    h1{font-size:26pt!important;line-height:1.14;max-width:none}
    .kick{font-size:8.5pt;color:#00655a}
    .openfoot p{font-size:10pt;max-width:none}
    .counts dd{font-size:16pt}
    .room{padding:0}
    /* 프로젝트 한 건이 페이지 중간에서 잘리지 않게 */
    .piece{break-inside:auto;margin-bottom:9mm;
      display:grid!important;grid-template-columns:64mm 1fr!important;gap:6mm!important;
      border-bottom:1px solid #ddd;padding-bottom:6mm}
    .piece:nth-child(even) .shot,.piece:nth-child(3n) .shot{grid-column:1!important;grid-row:1!important}
    .piece:nth-child(even) .info,.piece:nth-child(3n) .info{grid-column:2!important;grid-row:1!important}
    .shot{border:1px solid #ddd}
    .shot img{filter:none!important;transform:none!important}
    .shot::after{display:none}
    .info h2{font-size:13pt!important;color:#000!important;margin-bottom:2mm}
    .info p{font-size:9pt;color:#333}
    .n,.role,.meta{font-size:7.5pt;color:#666}
    .chips span{border-color:#ccc;color:#444;font-size:7pt}
    /* 인쇄에서는 접힌 케이스 스터디도 전부 보여준다 */
    .more{display:none!important}
    .case{display:grid!important;grid-column:1/-1!important;grid-template-columns:1fr 1fr!important;
      gap:6mm!important;border-top:1px solid #ddd;margin-top:4mm;padding-top:4mm}
    /* 블록 단위로만 잘리게 해서 문장이 페이지 경계에서 끊기지 않도록 */
    .case>div,.flow li,.stack div,.dec li,.info{break-inside:avoid}
    .info h2{break-after:avoid}
    .case h3{font-size:7.5pt;color:#00655a}
    .case p,.stack dd,.dec li{font-size:8.5pt;color:#333}
    .flow{flex-direction:row!important;flex-wrap:wrap}
    .flow li{font-size:7.5pt;color:#333;background:#f7f7f7;border-color:#ddd;
      padding:2mm 2.5mm;margin:0 3mm 3mm 0;flex:1 1 26mm;min-width:24mm}
    .flow li .s{color:#00655a;font-size:6.5pt}
    .flow li .t{font-size:7.5pt;color:#333}
    .flow li::after{right:-3mm;width:3mm;background:#bbb}
    .flow li::before{right:-3mm;border-left-color:#888}
    .band{page-break-before:auto}
    .band h2{font-size:15pt}
    .prin h3{font-size:10pt}.prin p{font-size:9pt}
    footer{border-top:1px solid #ccc;font-size:8pt;color:#555}
    a{color:#000;text-decoration:none}
    /* 링크는 지면에서 주소가 보여야 쓸모가 있다 */
    .piece::after{content:attr(href);font-family:var(--grot);font-size:7pt;color:#777;
      grid-column:2;word-break:break-all}
  }
  /* 모바일 히어로: 고정 헤더가 흐름으로 바뀌므로 하단 정렬과 뷰포트 높이를 해제한다.
     .open 정의 뒤에 와야 캐스케이드에서 이긴다. */
  @media(max-width:720px){
    .open{min-height:auto;justify-content:flex-start;padding:26px 0 clamp(26px,6vw,44px)}
    .openfoot{margin-top:24px}
    .room{padding-top:8px}
  }
</style>
<meta name="description" content="이진희 · AI Product Designer. 교육 제품을 설계하고 프로토타입을 직접 만들어 배포합니다. GitHub Pages에 배포된 프로토타입 14개.">
<link rel="canonical" href="https://jinilee-hue.github.io/portfolio/">

<meta property="og:url" content="https://jinilee-hue.github.io/portfolio/">

<body>
<a class="skip" href="#room">본문으로 건너뛰기</a>
<header>
  <span class="mark">이진희 · Jinhee Lee</span>
  <nav>
    <a href="#room" id="nav-work">WORK</a>
    <a href="#principles" id="nav-prin">PRINCIPLES</a>

</header>

<main>
<div class="wrap">
  <section class="open">
    <p class="kick" id="kick"></p>
    <h1 id="h1"></h1>
    <div class="openfoot">
      <p id="lede"></p>

  <section class="tl" id="tl" aria-labelledby="tl-h">
    <div class="tl-head"><h2 id="tl-h"></h2><span id="tl-note"></span></div>
    <div class="tl-axis" id="tl-axis"></div>
    <div id="tl-rows"></div>
  </section>
</div>

<div class="wrap"><div class="room" id="room"></div></div>

<div class="wrap"><section class="band" id="principles">
  <h2 id="prin-h"></h2>
  <div class="prin" id="prin"></div>
</section></div>
</main>

<div class="wrap"><footer>
  <p class="colo" id="colophon"></p>
  <a href="https://github.com/jinilee-hue">github.com/jinilee-hue</a>
</footer></div>

<script type="module">
import { loadProjects, pick, lang, setLang, onRender, fmtDate } from './assets/shared.js';

const COPY={
  ko:{
    kick:'AI Product Designer · EduPoly · Seoul',
    h1:'만든 걸 <i>보여주는</i> 게 제일 빠르다.',
    lede:'교육 제품을 설계하고, 프로토타입은 직접 만들어 배포한다. 아래 화면은 목업이 아니라 실제 배포된 페이지를 그대로 캡처한 것이고, 누르면 그 주소로 열린다.',
    counts:[['배포','{n}'],['라이브','{live}'],['최근','{last}']],
    open:'열기', more:'제작 과정 상세', less:'상세 접기', pdf:'PDF로 저장',
    mPeriod:'기간', mCommits:'커밋', mRole:'역할',
    cIntent:'기획 의도', cConcept:'디자인 컨셉', cFlow:'흐름', cStack:'기술 스택', cDec:'설계 결정',
    tlH:'작업 타임라인', tlNote:'첫 커밋 – 마지막 커밋 · 프로젝트 {n}개',
    prinH:'같이 일할 때 알아두면 좋은 것들',
    prin:[
      ['AI는 초안을 늘리는 도구다','한 방향을 빨리 뽑으려고 쓰지 않는다. 같은 시간에 검토할 방향의 수를 늘리려고 쓴다. 고르는 일은 위임하지 않는다.'],
      ['판단이 필요하면 눌러볼 수 있게 만든다','정지 이미지는 클릭했을 때 뭐가 되는지 말해주지 못한다. 결정이 필요한 화면은 동작하는 프로토타입으로 회의에 올린다.'],
      ['토큰이 먼저, 화면은 그다음','대시보드 두 개가 브랜드만 바꿔 같은 뼈대를 재사용할 수 있었던 이유. 색과 타입이 화면이 아니라 토큰에 적혀 있었다.'],
      ['AI를 쓰지 않는 선을 정해둔다','최종 카피, 브랜드 판단, 접근성 검증은 직접 한다. 생성물이 90% 맞을 때 남은 10%를 알아보는 게 디자이너의 일이다.'],
    ],
    colophon:'이 사이트는 Claude Code로 만들었다. 처음 제안받은 기본값(Inter · 인디고 그래디언트 · 3단 카드 그리드)은 전부 버렸다. 프로젝트 목록과 썸네일은 GitHub Actions가 매일 자동으로 다시 채운다.',
  },
  en:{
    kick:'AI Product Designer · EduPoly · Seoul',
    h1:'The fastest answer is <i>showing</i> the thing.',
    lede:'I design education products and build the prototypes myself. These are screenshots of pages actually deployed — not mockups. Click one and it opens.',
    counts:[['Shipped','{n}'],['Live','{live}'],['Latest','{last}']],
    open:'Open', more:'Full process', less:'Collapse', pdf:'Save as PDF',
    mPeriod:'Period', mCommits:'Commits', mRole:'Role',
    cIntent:'Intent', cConcept:'Design concept', cFlow:'Flow', cStack:'Stack', cDec:'Decisions',
    tlH:'Timeline', tlNote:'first – last commit · {n} projects',
    prinH:'Worth knowing before we work together',
    prin:[
      ['AI widens the draft, not the shortcut','I don\'t use it to reach one direction faster. I use it to review more directions in the same hour. Choosing is never delegated.'],
      ['If it needs a decision, make it pressable','A still image can\'t answer what happens on click. Decision-bearing screens enter the room as working prototypes.'],
      ['Tokens first, screens second','Why two dashboards reused one skeleton across brands: color and type lived in tokens, not in the screens.'],
      ['Know where AI stops','Final copy, brand judgment and accessibility checks stay manual. When a generation is 90% right, catching the last 10% is the job.'],
    ],
    colophon:'Built with Claude Code. Its first defaults — Inter, an indigo gradient, a three-card grid — were all discarded. The project list and thumbnails are refilled daily by GitHub Actions.',
  }
};
let DATA=null;

function draw(){
  const L=lang(),c=COPY[L];
  document.documentElement.lang=L;
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===L)));
  kick.textContent=c.kick; h1.innerHTML=c.h1; lede.textContent=c.lede;

  const ps=DATA.projects.map(pick);
  const live=ps.filter(p=>p.live).length;
  const last=fmtDate(DATA.projects.map(p=>p.auto.pushed_at).sort().at(-1),L);
  counts.innerHTML=c.counts.map(([k,v])=>`<div><dt>${k}</dt><dd>${
    v.replace('{n}',ps.length).replace('{live}',live+'/'+ps.length).replace('{last}',last)}</dd></div>`).join('');

  // 링크(a)에 버튼을 중첩할 수 없어 article 로 감싸고 제목만 링크로 둔다
  // ── 타임라인: 전체 프로젝트의 실제 작업 구간(첫 커밋~마지막 커밋) ──
  const withSpan=ps.filter(p=>p.first&&p.last);
  if(withSpan.length){
    const toN=s=>{const[y,m]=s.split('-').map(Number);return y*12+m;};
    const min=Math.min(...withSpan.map(p=>toN(p.first)));
    const max=Math.max(...withSpan.map(p=>toN(p.last)));
    const span=Math.max(1,max-min);
    const fmt=n=>`${Math.floor((n-1)/12)}.${String(((n-1)%12)+1).padStart(2,'0')}`;
    document.getElementById('tl-h').textContent=c.tlH;
    document.getElementById('tl-note').textContent=c.tlNote.replace('{n}',withSpan.length);
    const ticks=[min, min+Math.round(span/3), min+Math.round(span*2/3), max];
    document.getElementById('tl-axis').innerHTML=ticks.map(t=>`<span>${fmt(t)}</span>`).join('');
    document.getElementById('tl-rows').innerHTML=withSpan.map(p=>{
      const a=toN(p.first), b=toN(p.last);
      const left=((a-min)/span)*100, w=Math.max(1.5,((b-a)/span)*100);
      return `<div class="tl-row"><b title="${p.title}">${p.title}</b>
        <div class="tl-track"><span class="tl-bar" style="left:${left}%;width:${w}%"></span></div></div>`;
    }).join('');
  } else { document.getElementById('tl').style.display='none'; }

  // 언어 바이트 → 비율 막대. 색은 액센트 한 색의 투명도 단계로만(무지개 팔레트 금지).
  const shades=['1','.72','.52','.36','.24','.15'];
  const langBar=p=>{
    let e=Object.entries(p.langBytes||{}); if(!e.length) return '';
    let tot=e.reduce((s,[,v])=>s+v,0); if(!tot) return '';
    // 1% 미만은 범례에서 뺀다 — 'Shell 0%' 같은 항목은 정보가 아니라 잡음이다
    e=e.filter(([,v])=>v/tot>=0.01);
    tot=e.reduce((s,[,v])=>s+v,0); if(!tot) return '';
    return `<div class="langbar" role="img" aria-label="${e.map(([k,v])=>k+' '+Math.round(v/tot*100)+'%').join(', ')}">${
      e.map(([,v],i)=>`<i style="width:${(v/tot*100).toFixed(1)}%;background:var(--accent);opacity:${shades[i]||'.12'}"></i>`).join('')
    }</div><div class="langkey">${e.map(([k,v],i)=>
      `<span><em style="background:var(--accent);opacity:${shades[i]||'.12'}"></em>${k} ${Math.round(v/tot*100)}%</span>`).join('')}</div>`;
  };
  const maxCommits=Math.max(...ps.map(p=>p.commits||0),1);
  const gauge=p=>p.commits?`<div class="gauge"><span>${c.mCommits}</span>
     <span class="g"><i style="width:${Math.max(3,p.commits/maxCommits*100)}%"></i></span>
     <b>${p.commits}</b></div>`:'';
  const IC={cal:'<svg class="ic" viewBox="0 0 16 16"><rect x="2" y="3.5" width="12" height="10"/><path d="M2 6.5h12M5.5 2v3M10.5 2v3"/></svg>',
            usr:'<svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="2.6"/><path d="M3 13.5c0-2.5 2.2-4 5-4s5 1.5 5 4"/></svg>'};

  // 태그 아이콘 — 라이브러리 없이 도형으로만 그린다(요청 0개, 색은 액센트 상속).
  const G={
    cursor:'<path d="M3 2l5.5 12 2-5 5-2z"/>',
    type:'<path d="M3 4h10M8 4v9M5.5 13h5"/>',
    tablet:'<rect x="3.5" y="2" width="9" height="12" rx="1"/><path d="M7 12h2"/>',
    spark:'<path d="M8 2l1.4 3.9L13.5 7 9.4 8.4 8 12.5 6.6 8.4 2.5 7l4.1-1.1z"/>',
    grid:'<rect x="2.5" y="2.5" width="4.5" height="4.5"/><rect x="9" y="2.5" width="4.5" height="4.5"/><rect x="2.5" y="9" width="4.5" height="4.5"/><rect x="9" y="9" width="4.5" height="4.5"/>',
    chart:'<path d="M2.5 13.5V9M6.2 13.5V4M9.9 13.5V7M13.6 13.5V2.5"/>',
    game:'<rect x="1.8" y="4.5" width="12.4" height="7" rx="3.5"/><path d="M4.6 6.8v2M3.6 7.8h2M10.6 7.8h.02M12 9.2h.02"/>',
    code:'<path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5"/>',
    mic:'<rect x="6" y="2" width="4" height="7" rx="2"/><path d="M3.8 8a4.2 4.2 0 008.4 0M8 12.2V14"/>',
    doc:'<path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3"/>',
    swatch:'<circle cx="6" cy="6" r="3.4"/><circle cx="10" cy="10" r="3.4"/>',
    layers:'<path d="M8 2.2l5.6 3L8 8.2 2.4 5.2z"/><path d="M2.4 8.8L8 11.8l5.6-3"/>',
    flask:'<path d="M6.4 2v4L3 12.6c-.4.8.1 1.4.9 1.4h8.2c.8 0 1.3-.6.9-1.4L9.6 6V2M5.6 2h4.8"/>',
    box:'<path d="M8 2l5.5 3v6L8 14l-5.5-3V5z"/><path d="M8 8l5.5-3M8 8v6M8 8L2.5 5"/>'
  };
  // 키워드 → 아이콘. 앞에서부터 첫 매칭을 쓴다.
  const TAGMAP=[
    [/design system|token|디자인 시스템|토큰/i,'layers'],
    [/dashboard|data viz|chart|대시보드/i,'chart'],
    [/game|게임|play/i,'game'],
    [/speech|voice|mic|발음|음성/i,'mic'],
    [/typograph|타이포|조판/i,'type'],
    [/tablet|mobile|태블릿/i,'tablet'],
    [/generative ai|ai agent|claude|prompt|생성|에이전트/i,'spark'],
    [/prototype|프로토타입|interactive|인터랙/i,'cursor'],
    [/react|typescript|javascript|html|css|python|vanilla/i,'code'],
    [/editorial|content|웹진|콘텐츠|kids ux|ux/i,'doc'],
    [/multi-?brand|brand|브랜드|색|palette/i,'swatch'],
    [/study|a\/b|research|리서치|시안|direction/i,'flask'],
    [/enterprise|console|workflow|role|운영|콘솔/i,'grid'],
  ];
  const tagIcon=t=>{
    for(const [re,k] of TAGMAP) if(re.test(t)) return `<svg class="ic" viewBox="0 0 16 16">${G[k]}</svg>`;
    return `<svg class="ic" viewBox="0 0 16 16">${G.box}</svg>`;
  };

  room.innerHTML=ps.map((p,i)=>`
    <article class="piece">
      <a class="shot" data-open="${c.open} ↗" href="${p.live||p.repo}" target="_blank" rel="noopener"
         aria-label="${p.title} ${c.open}">
        <img src="${p.shot}" alt="${p.title} 실제 배포 화면" decoding="async"
             ${i===0?'fetchpriority="high"':'fetchpriority="low"'} width="1440" height="900">
      </a>
      <div class="info">
        <span class="n">${String(i+1).padStart(2,'0')} / ${String(ps.length).padStart(2,'0')}${p.kicker?' · '+p.kicker:''}</span>
        <h2><a href="${p.live||p.repo}" target="_blank" rel="noopener">${p.title}</a></h2>
        <p>${p.summary}</p>
        <div class="meta">
          ${p.period?`<span>${IC.cal}<b>${p.period}</b></span>`:''}
          ${p.role?`<span>${IC.usr}<b>${p.role}</b></span>`:''}
        </div>
        ${langBar(p)}
        ${gauge(p)}
        <div class="chips">${p.tags.slice(0,4).map(x=>`<span>${tagIcon(x)}${x}</span>`).join('')}</div>
        ${p.hasCase?`<button class="more no-print" type="button" aria-expanded="false"
           aria-controls="case-${p.id}"><span class="lbl">${c.more}</span><i class="chev"></i></button>`:''}
      </div>
      ${p.hasCase?`<div class="case" id="case-${p.id}">
        <div>
          ${p.intent?`<h3>${c.cIntent}</h3><p>${p.intent}</p>`:''}
          ${p.concept?`<h3>${c.cConcept}</h3><p>${p.concept}</p>`:''}
          ${p.flow.length?`<h3>${c.cFlow}</h3><ol class="flow">${p.flow.map(f=>
            `<li><span class="s">${f.step}</span><span class="t">${lang()==='ko'?f.ko:(f.en||f.ko)}</span></li>`).join('')}</ol>`:''}
        </div>
        <div>
          ${p.stack.length?`<h3>${c.cStack}</h3><dl class="stack">${p.stack.map(s=>
            `<div><dt>${s.group}</dt><dd>${s.items.join(' · ')}</dd></div>`).join('')}</dl>`:''}
          ${p.decisions.length?`<h3>${c.cDec}</h3><ul class="dec">${p.decisions.map(d=>
            `<li>${lang()==='ko'?d.ko:(d.en||d.ko)}</li>`).join('')}</ul>`:''}
        </div>
      </div>`:''}
    </article>`).join('');

  // 줄바꿈된 플로우 노드의 연결선 정리 — 줄 끝 노드는 화살표를 감춘다
  const trimFlow=()=>{
    document.querySelectorAll('.flow').forEach(ol=>{
      const items=[...ol.children];
      items.forEach(li=>li.classList.remove('row-end'));
      items.forEach((li,i)=>{
        const next=items[i+1];
        if(!next || next.offsetTop>li.offsetTop+2) li.classList.add('row-end');
      });
    });
  };
  window.addEventListener('resize', trimFlow);

  room.querySelectorAll('.more').forEach(b=>b.addEventListener('click',()=>{
    const box=document.getElementById(b.getAttribute('aria-controls'));
    const open=box.classList.toggle('open');
    b.setAttribute('aria-expanded',String(open));
    b.querySelector('.lbl').textContent=open?c.less:c.more;
    if(open&&!window.matchMedia('(prefers-reduced-motion:reduce)').matches){
      box.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
    if(open) requestAnimationFrame(trimFlow);
  }));


  // ── AI 가독성 레이어: 실제 데이터로 JSON-LD 채우기 ──
  const site='https://jinilee-hue.github.io/portfolio/';
  document.getElementById('ld-person').textContent=JSON.stringify({
    "@context":"https://schema.org","@type":"Person","name":"이진희","alternateName":"Jinhee Lee",
    "jobTitle":"AI Product Designer","worksFor":{"@type":"Organization","name":"EduPoly"},
    "url":site,"sameAs":["https://github.com/jinilee-hue"],
    "knowsAbout":["UI/UX Design","Design Systems","Design Tokens","Prototyping","Generative AI","EdTech"]
  });
  document.getElementById('ld-work').textContent=JSON.stringify({
    "@context":"https://schema.org","@type":"ItemList","name":"Selected work",
    "numberOfItems":ps.length,
    "itemListElement":ps.map((p,i)=>({"@type":"ListItem","position":i+1,
      "item":{"@type":"CreativeWork","name":p.title,"url":p.live||p.repo,
        "description":p.summary,"author":{"@type":"Person","name":"이진희"},
        "dateModified":p.pushed}}))
  });
  document.getElementById('prin-h').textContent=c.prinH;
  prin.innerHTML=c.prin.map(([h,b])=>`<article><h3>${h}</h3><p>${b}</p></article>`).join('');
  colophon.textContent=c.colophon;
}
onRender(draw);
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));

// PDF: 인쇄 대화상자에서 '대상 → PDF로 저장'. 접힌 케이스 스터디는 CSS 로 모두 펼쳐 인쇄된다.
document.getElementById('pdf').addEventListener('click',()=>window.print());
window.addEventListener('beforeprint',()=>{
  document.title = (lang()==='ko'?'이진희 포트폴리오 — ':'Jinhee Lee Portfolio — ')
    + new Date().toISOString().slice(0,10);
});
loadProjects().then(d=>{DATA=d;draw();}).catch(e=>{room.textContent='데이터 로드 실패: '+e.message;});
</script>
</body>
</html>

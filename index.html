<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이진희 — AI Product Designer · Portfolio</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Archivo:wdth,wght@75..125,400;75..125,600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A; --fg:#F5F3EF; --fg-55:rgba(245,243,239,.78); --fg-28:rgba(245,243,239,.52);
    --line:rgba(245,243,239,.16); --accent:#2AF0CE;
    --disp:'Fraunces',ui-serif,Georgia,serif;
    --grot:'Archivo',system-ui,sans-serif;
    --sans:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
    --ease:cubic-bezier(.19,1,.22,1);
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#FAFAF8;--fg:#0D0D0C;--fg-55:rgba(13,13,12,.76);--fg-28:rgba(13,13,12,.5);
      --line:rgba(13,13,12,.16);--accent:#00655A;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
    font-size:16px;line-height:1.7;letter-spacing:-.003em;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  /* 고정 헤더가 스크롤 목적지를 가리지 않도록 (WCAG 2.4.11 Focus Not Obscured) */
  :where(h2,h3,.case,.band,[id]){scroll-margin-top:72px}
  a{color:inherit}
  .wrap{max-width:1500px;margin:0 auto;padding:0 clamp(16px,4vw,56px)}

  /* 밴드마다 배경이 바뀌므로 blend-mode 로는 대비를 보장할 수 없다.
     반투명 배경 + 블러로 어떤 밴드 위에서도 읽히게 한다. */
  header{position:fixed;top:0;left:0;right:0;z-index:30;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:14px clamp(16px,4vw,56px);color:#F5F3EF;pointer-events:none;
    background:rgba(10,10,10,.82);backdrop-filter:saturate(160%) blur(14px);
    border-bottom:1px solid rgba(245,243,239,.12)}
  @supports not (backdrop-filter: blur(1px)){header{background:rgba(10,10,10,.95)}}
  /* 모바일: 좁은 폭에서 이름과 내비가 겹치고 본문 위에 올라탄다.
     흐름에 맞춰 두 줄로 내리고, blend mode 대신 배경을 깔아 가독성을 확보한다. */
  @media(max-width:720px){
    header{position:static;mix-blend-mode:normal;flex-wrap:wrap;gap:6px 10px;
      color:var(--fg);background:var(--bg);border-bottom:1px solid var(--line);
      padding:12px clamp(16px,4vw,56px)}
    header .mark{flex:1 0 100%;font-size:15px}
    header nav{flex-wrap:wrap;margin-left:-9px}
    header a,header button{color:var(--fg);opacity:.75;font-size:10.5px;padding:5px 9px}
  }
  header *{pointer-events:auto}
  .mark{font-family:var(--disp);font-weight:600;font-size:17px;letter-spacing:-.01em}
  header nav{display:flex;gap:6px;align-items:center}
  header a,header button{font-family:var(--grot);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    text-decoration:none;color:#fff;background:none;border:0;cursor:pointer;padding:7px 10px;opacity:.82}
  header a:hover,header button:hover{opacity:1}
  header button[aria-pressed=true]{opacity:1;text-decoration:underline;text-underline-offset:4px}
  header a:focus-visible,header button:focus-visible{outline:2px solid #fff;outline-offset:2px;opacity:1}

  /* 히어로는 짧게. 작품 무대가 첫 화면의 대부분을 가져간다 (Marshall). */
  /* 표지 — 화면을 꽉 채우는 높이. 인쇄에서 A4 표지 한 장으로 쓰는 것과 짝을 이룬다 */
  .open{min-height:calc(100svh - 60px);display:flex;flex-direction:column;justify-content:center;
    gap:clamp(28px,5svh,64px);padding:max(72px,5vw) 0 clamp(28px,4svh,48px);position:relative}
  .open .openfoot{margin-top:auto}
  /* 표제(kick+h1)를 남는 공간의 세로 중앙에 — 위아래 auto 마진이 균형을 잡는다 */
  .open .kick{margin-top:auto}
  .open h1{margin-bottom:auto}
  .kick{font-family:var(--grot);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--disp);font-weight:300;font-variation-settings:'opsz' 120;
    font-size:clamp(2.5rem,8.4vw,7.2rem);line-height:.94;letter-spacing:-.028em;margin:0;max-width:16ch;
    text-wrap:balance;word-break:keep-all;overflow-wrap:break-word}
  /* 한글은 라틴 디스플레이 서체에 글리프가 없어 명조로 폴백된다 — 본문 서체로 되돌리고 무게로 대비를 만든다 */
  :lang(ko) h1{font-family:var(--sans);font-weight:600;letter-spacing:-.035em;line-height:1.02;
    font-size:clamp(1.8rem,5.4vw,3.6rem)}
  :lang(ko) h1 i{font-weight:800}
  :lang(ko) .info h2,:lang(ko) .band h2{font-family:var(--sans);font-weight:600;letter-spacing:-.028em;
    word-break:keep-all}
  :lang(ko) .counts dd{font-family:var(--sans);font-weight:600}
  :lang(ko) .mark{font-family:var(--sans);font-weight:700}
  h1 i{font-weight:600;font-style:normal;color:var(--accent)}
  .openfoot{display:flex;flex-wrap:wrap;gap:20px 48px;align-items:end;justify-content:space-between;
    margin-top:clamp(28px,4vw,52px);border-top:1px solid var(--line);padding-top:20px}
  .openfoot p{margin:0;max-width:44ch;color:var(--fg-55);font-size:1.05rem;line-height:1.72}
  .counts{display:flex;gap:clamp(20px,3vw,44px)}
  .counts div{white-space:nowrap}
  .counts dt{font-family:var(--grot);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--fg-28);margin:0 0 4px}
  .counts dd{margin:0;font-family:var(--disp);font-size:clamp(1.6rem,3vw,2.4rem);line-height:1;
    font-variant-numeric:tabular-nums}

  /* 작업 — Marshall(한 작품 무대) + Paragraph/Tamburins(기능 화면 콜라주).
     화면이 거의 전면을 먹고, 카피는 옆에 짧게, 액센트는 CTA와 라벨에만 쓴다. */
  .gutter{padding-inline:max(clamp(16px,4vw,56px), calc(50% - 750px + clamp(16px,4vw,56px)))}
  .room{padding:0;background:#070707;color:#F5F3EF}
  .pager{position:sticky;top:56px;z-index:22;display:flex;align-items:center;gap:12px;
    min-height:52px;background:rgba(7,7,7,.9);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(245,243,239,.12)}
  .pager .count{font-family:var(--grot);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(245,243,239,.4);flex:none;font-variant-numeric:tabular-nums}
  .pager .dots{display:flex;gap:5px;flex:1;overflow-x:auto;scrollbar-width:none}
  .pager .dots::-webkit-scrollbar{display:none}
  .pager .dots button{flex:none;width:7px;height:7px;padding:0;border:0;border-radius:50%;
    background:rgba(245,243,239,.28);cursor:pointer}
  .pager .dots button[aria-current=true]{background:var(--accent);width:18px;border-radius:4px}
  .pager .navb{display:flex;gap:8px;flex:none}
  .pager .navb button{width:36px;height:36px;background:none;border:1px solid rgba(245,243,239,.28);
    color:#F5F3EF;cursor:pointer;font-size:16px;line-height:1}
  .pager .navb button:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#04120F}
  .pager .navb button:disabled{opacity:.25;cursor:default}
  .pager button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .show[hidden]{display:none!important}

  /* B my map: 기기들이 날고, 제목은 그 옆. 화면이 카피보다 크다. */
  .splash{display:grid;gap:clamp(12px,2vw,28px);align-items:center;
    min-height:auto;padding-block:clamp(16px,3vw,36px) 8px;overflow:hidden}
  @media(min-width:960px){.splash{grid-template-columns:minmax(0,1.35fr) minmax(260px,.7fr)}}
  .copy{position:relative;z-index:2;padding-bottom:24px}
  .copy .num{font-family:var(--grot);font-size:13px;letter-spacing:.18em;color:rgba(245,243,239,.4);
    margin:0 0 10px;font-variant-numeric:tabular-nums}
  .copy .kick{color:var(--accent);margin:0 0 10px;font-size:11.5px}
  .copy h2{font-family:var(--sans);font-weight:800;font-size:clamp(2.1rem,4.4vw,4.2rem);
    letter-spacing:-.04em;line-height:1.02;margin:0 0 16px;word-break:keep-all;text-wrap:balance}
  .copy .sum{margin:0;color:rgba(245,243,239,.62);max-width:36ch;font-size:.98rem;word-break:keep-all;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .play{display:inline-flex;align-items:center;gap:14px;margin:22px 0 22px;text-decoration:none;color:inherit}
  .play b{font-family:var(--grot);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    background:var(--accent);color:#04120F;padding:11px 22px}
  .play span{font-family:var(--grot);font-size:11px;letter-spacing:.08em;color:rgba(245,243,239,.45)}
  .facts{margin:0;display:grid;gap:8px}
  .facts div{display:grid;grid-template-columns:6.8rem 1fr;gap:10px;align-items:baseline}
  .facts dt{margin:0;font-family:var(--grot);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:rgba(245,243,239,.38)}
  .facts dd{margin:0;font-size:13px;color:rgba(245,243,239,.78);font-variant-numeric:tabular-nums}

  /* 관여도 게이지 — 단계별 0~100 독립. 전부 100이면 네 줄이 꽉 찬다 */
  .contrib{margin-top:18px}
  .contrib .k{margin:0 0 9px}
  .cgrid{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;
    max-width:330px}
  .cg-l{font-family:var(--grot);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:rgba(245,243,239,.42);white-space:nowrap}
  .cg-t{position:relative;height:6px;border-radius:3px;overflow:hidden;
    background:rgba(245,243,239,.1)}
  .cg-t i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
  .cg-v{font-family:var(--grot);font-size:12px;font-weight:600;color:rgba(245,243,239,.75);
    font-variant-numeric:tabular-nums;min-width:3.4ch;text-align:right}

  .fly{position:relative;height:min(68svh,620px)}
  .frame,.frame *{box-sizing:border-box}
  .frame{display:block;position:absolute}
  .shot{position:relative;overflow:hidden;display:block;width:100%;background:#111}
  .shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
  .fly .d,.fly .t,.fly .m{padding:9px;border-radius:22px;background:#0e0e0e;
    box-shadow:0 24px 56px rgba(0,0,0,.48), inset 0 0 0 1px rgba(255,255,255,.14);
    transform:none}
  .fly .d{width:78%;left:0;top:14%;z-index:1;
    padding:10px 10px 18px;border-radius:12px}
  .fly .d .shot{aspect-ratio:1440/900;border-radius:4px}
  .fly .t{width:28%;right:0;left:auto;top:2%;z-index:3}
  .fly .t .shot{aspect-ratio:834/1112;border-radius:12px}
  .fly .m{width:18%;right:24%;left:auto;bottom:0;z-index:2}
  .fly .m .shot{aspect-ratio:390/844;border-radius:12px}
  @media(max-width:959px){
    .fly{height:58vw;order:-1}
    .fly .d{width:82%;top:18%}
    .fly .t{width:30%}
    .fly .m{width:20%;right:26%}
  }

  /* 보드: 캡처와 '이 화면에서' 설명을 좌우로 붙인다. 블록마다 좌우를 뒤집는다. */
  .board{background:#F3F1EC;color:#16140F;border-radius:28px 28px 0 0;margin-top:-28px;
    position:relative;z-index:4;padding:clamp(40px,5vw,72px) 0 clamp(48px,6vw,80px)}
  .board .k{font-family:var(--grot);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:#A6421F;margin:0 0 22px}
  .feats{display:grid;gap:clamp(36px,5vw,72px)}
  .feats figure{margin:0;display:grid;gap:18px 40px;align-items:start}
  @media(min-width:800px){
    .feats figure{grid-template-columns:minmax(0,1.45fr) minmax(220px,.9fr)}
    .feats figure:nth-child(even){grid-template-columns:minmax(220px,.9fr) minmax(0,1.45fr)}
    .feats figure:nth-child(even) .ph{order:2}
  }
  .feats .ph{display:block;padding:8px;border-radius:18px;background:#fff;
    box-shadow:0 18px 40px rgba(20,18,12,.14)}
  .feats .ph .shot{aspect-ratio:16/10;border-radius:12px;background:#eee}
  .feats .ph .shot.is-portrait{aspect-ratio:9/16}
  .feats figcaption .k{margin:0 0 10px}
  .feats figcaption b{display:block;font-size:clamp(1.2rem,2.2vw,1.7rem);font-weight:700;
    letter-spacing:-.03em;line-height:1.2;margin:0 0 10px;word-break:keep-all}
  .feats figcaption .note{display:block;font-size:.95rem;line-height:1.65;
    color:rgba(22,20,15,.7);word-break:keep-all;max-width:44ch}
  .feats figcaption ol{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px}
  .feats figcaption li{display:grid;grid-template-columns:2rem 1fr;gap:8px;
    font-size:.86rem;color:rgba(22,20,15,.68)}
  .feats figcaption li b{font-family:var(--grot);font-weight:400;font-size:11px;
    letter-spacing:.04em;color:rgba(22,20,15,.38);margin:0;line-height:1.5}

  .brief{display:grid;gap:18px;margin-top:clamp(22px,3vw,36px);padding-top:22px;
    border-top:1px solid rgba(22,20,15,.12)}
  @media(min-width:800px){.brief{grid-template-columns:1.2fr 1fr}}
  .brief h3{font-family:var(--grot);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:#A6421F;margin:0 0 8px}
  .brief p{margin:0;font-size:.9rem;line-height:1.65;color:rgba(22,20,15,.7);word-break:keep-all}
  .brief ol{margin:0;padding:0;list-style:none;display:grid;gap:6px}
  .brief li{display:grid;grid-template-columns:2rem 1fr;gap:8px;font-size:.88rem;color:rgba(22,20,15,.7)}
  .brief li b{font-family:var(--grot);font-weight:400;font-size:11px;color:rgba(22,20,15,.38)}

  /* 2) 관여도 — 단계별 0~100 독립 게이지. 혼자 다 했으면 전부 100. */
  .cgrid{display:grid;grid-template-columns:auto 1fr auto;gap:7px 12px;align-items:center;
    margin:14px 0 4px;max-width:340px}
  .cg-l{font-family:var(--grot);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--fg-28);white-space:nowrap}
  .cg-t{position:relative;height:6px;border-radius:3px;overflow:hidden;
    background:color-mix(in oklab,var(--fg) 9%,transparent)}
  .cg-t i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
  .cg-v{font-family:var(--grot);font-size:12px;font-weight:600;color:var(--fg-55);
    font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}

  /* 3) 툴 · 반응형 */
  .trows{display:flex;flex-direction:column;gap:5px;margin-top:12px}
  .trow{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;
    font-family:var(--grot);font-size:12px;letter-spacing:.02em}
  .trow-l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-28);
    min-width:5.5em}
  .trow b{font-weight:500;color:var(--fg-55)}
  .trow .sep{width:3px;height:3px;border-radius:50%;background:var(--fg-28);
    display:inline-block;vertical-align:middle;margin:0 2px}

  /* 4) 아이콘 — 메타 항목 식별용, 도형으로만 그린다 */
  .ic{width:11px;height:11px;flex:none;opacity:.5;stroke:currentColor;fill:none;stroke-width:1.6}
  .meta span{display:inline-flex;align-items:center;gap:5px}

  .band{border-top:1px solid var(--line);padding:clamp(48px,8vw,100px) 0;
    margin-top:clamp(40px,6vw,80px)}
  .band h2{font-family:var(--disp);font-weight:300;font-size:clamp(1.6rem,4vw,2.8rem);
    letter-spacing:-.02em;margin:0 0 clamp(24px,3vw,44px);max-width:20ch}
  .prin{display:grid;gap:clamp(22px,3vw,44px)}
  @media(min-width:900px){.prin{grid-template-columns:repeat(2,1fr)}}
  .prin article{border-top:1px solid var(--line);padding-top:14px}
  .prin h3{font-family:var(--grot);font-weight:600;font-size:1.04rem;letter-spacing:.005em;margin:0 0 10px}
  .prin p{margin:0;color:var(--fg-55);font-size:.99rem;line-height:1.72;word-break:keep-all}
  footer{border-top:1px solid var(--line);padding:30px 0 64px;color:var(--fg-28);font-size:13.5px;
    display:flex;flex-wrap:wrap;gap:14px 36px;justify-content:space-between;align-items:baseline}
  footer .colo{max-width:58ch;line-height:1.72;word-break:keep-all}
  .skip{position:absolute;left:-9999px}
  .skip:focus{left:12px;top:12px;z-index:99;background:var(--accent);color:#04120F;padding:10px 14px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ── 인쇄 / PDF 저장 ──────────────────────────────
     브라우저의 '대상: PDF로 저장' 으로 벡터 텍스트 PDF 가 나온다.
     화면용 다크 테마를 흰 종이로 뒤집고, 케이스 스터디는 전부 펼쳐 인쇄한다. */
  @media print{
    @page{size:A4;margin:14mm 12mm}
    :root{--bg:#fff;--fg:#000;--fg-55:#3a3a3a;--fg-28:#6a6a6a;--line:#c9c9c9;--accent:#00655a}
    html,body{background:#fff!important;color:#000!important}
    header,.no-print{display:none!important}
    .wrap{max-width:none;padding:0}
    /* 표지: A4 한 장을 통째로 쓴다. 이름·주장·지표가 세로 중앙에 온다 */
    .open{min-height:calc(297mm - 28mm);display:flex;flex-direction:column;
      justify-content:center;padding:0;border-bottom:0;margin-bottom:0;
      page-break-after:always}
    .open h1{font-size:40pt!important;line-height:1.08;margin-bottom:10mm}
    .open .kick{font-size:11pt;margin-bottom:8mm}
    .openfoot{border-top:1px solid #ccc;padding-top:8mm;margin-top:14mm}
    .openfoot p{font-size:11.5pt;line-height:1.7;max-width:60ch}
    .counts dd{font-size:22pt}
    h1{font-size:26pt!important;line-height:1.14;max-width:none}
    .kick{font-size:8.5pt;color:#00655a}
    .openfoot p{font-size:10pt;max-width:none}
    .counts dd{font-size:16pt}
    .pager,.play{display:none!important}
    .show[hidden]{display:block!important}
    .splash{min-height:auto;page-break-after:avoid}
    .board{background:#fff;color:#000;border-radius:0;margin:0}
    /* 프로젝트 한 건이 페이지 중간에서 잘리지 않게 */
    .piece{break-inside:auto;margin-bottom:9mm;
      display:grid!important;grid-template-columns:64mm 1fr!important;gap:6mm!important;
      border-bottom:1px solid #ddd;padding-bottom:6mm}
    .piece:nth-child(even) .shot,.piece:nth-child(3n) .shot{grid-column:1!important;grid-row:1!important}
    .piece:nth-child(even) .info,.piece:nth-child(3n) .info{grid-column:2!important;grid-row:1!important}
    .frame{background:#eee;padding:1mm;border-radius:1mm}
    .frame--desktop::after,.frame--desktop::before,.frame--mobile::after{display:none}
    .shot{border:1px solid #ddd}
    .shots{gap:2mm}
    .shot img{filter:none!important;transform:none!important}
    .shot::after{display:none}
    .info h2{font-size:13pt!important;color:#000!important;margin-bottom:2mm}
    .info p{font-size:9pt;color:#333}
    .n,.role,.meta{font-size:7.5pt;color:#666}
    .chips span{border-color:#ccc;color:#444;font-size:7pt}
    /* 인쇄에서는 접힌 케이스 스터디도 전부 보여준다 */
    .more{display:none!important}
    .case{display:grid!important;grid-column:1/-1!important;grid-template-columns:1fr 1fr!important;
      gap:6mm!important;border-top:1px solid #ddd;margin-top:4mm;padding-top:4mm}
    /* 블록 단위로만 잘리게 해서 문장이 페이지 경계에서 끊기지 않도록 */
    .case>div,.flow li,.stack div,.dec li,.info{break-inside:avoid}
    .info h2{break-after:avoid}
    .case h3{font-size:7.5pt;color:#00655a}
    .case p,.stack dd,.dec li{font-size:8.5pt;color:#333}
    .flow{flex-direction:row!important;flex-wrap:wrap}
    .flow li{font-size:7.5pt;color:#333;background:#f7f7f7;border-color:#ddd;
      padding:2mm 2.5mm;margin:0 3mm 3mm 0;flex:1 1 26mm;min-width:24mm}
    .flow li .s{color:#00655a;font-size:6.5pt}
    .flow li .t{font-size:7.5pt;color:#333}
    .flow li::after{right:-3mm;width:3mm;background:#bbb}
    .flow li::before{right:-3mm;border-left-color:#888}
    .band{page-break-before:auto}
    .band h2{font-size:15pt}
    .prin h3{font-size:10pt}.prin p{font-size:9pt}
    footer{border-top:1px solid #ccc;font-size:8pt;color:#555}
    a{color:#000;text-decoration:none}
    /* 링크는 지면에서 주소가 보여야 쓸모가 있다 */
    .piece::after{content:attr(href);font-family:var(--grot);font-size:7pt;color:#777;
      grid-column:2;word-break:break-all}
  }
  /* 모바일 히어로: 고정 헤더가 흐름으로 바뀌므로 하단 정렬과 뷰포트 높이를 해제한다.
     .open 정의 뒤에 와야 캐스케이드에서 이긴다. */
  @media(max-width:720px){
    .open{min-height:auto;justify-content:flex-start;padding:26px 0 clamp(26px,6vw,44px)}
    .openfoot{margin-top:24px}
    .room{padding-top:8px}
  }
</style>
<meta name="description" content="이진희 · AI Product Designer. 교육 제품을 설계하고 프로토타입을 직접 만들어 배포합니다. GitHub Pages에 배포된 프로토타입 12개.">
<link rel="canonical" href="https://jinilee-hue.github.io/portfolio/">
<meta property="og:type" content="profile">
<meta property="og:title" content="이진희 — AI Product Designer">
<meta property="og:description" content="스스로 만들어 증명하는 디자이너. 기획부터 배포까지, 실제로 열리는 프로토타입 12개.">
<meta property="og:url" content="https://jinilee-hue.github.io/portfolio/">
<meta property="og:image" content="https://jinilee-hue.github.io/portfolio/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json" id="ld-person">{}</script>
<script type="application/ld+json" id="ld-work">{}</script>
</head>
<body>
<a class="skip" href="#room">본문으로 건너뛰기</a>
<header>
  <span class="mark">이진희 · Jinhee Lee</span>
  <nav>
    <a href="#room" id="nav-work">WORK</a>
    <a href="#principles" id="nav-prin">PRINCIPLES</a>
    <a href="https://github.com/jinilee-hue">GITHUB</a>
    <button type="button" id="pdf" class="no-print">PDF</button>
    <button type="button" data-lang="ko" aria-pressed="true">KO</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </nav>
</header>

<main>
<div class="wrap">
  <section class="open">
    <p class="kick" id="kick"></p>
    <h1 id="h1"></h1>
    <div class="openfoot">
      <p id="lede"></p>
      <dl class="counts" id="counts"></dl>
    </div>
  </section>

</div>

<!-- 밴드 배경이 화면 끝까지 닿아야 하므로 .wrap 으로 감싸지 않는다.
     콘텐츠 정렬선은 .piece 의 좌우 padding 이 직접 계산한다. -->
<div class="room" id="room"></div>

<div class="wrap"><section class="band" id="principles">
  <h2 id="prin-h"></h2>
  <div class="prin" id="prin"></div>
</section></div>
</main>

<div class="wrap"><footer>
  <p class="colo" id="colophon"></p>
  <a href="https://github.com/jinilee-hue">github.com/jinilee-hue</a>
</footer></div>

<script type="module">
import { loadProjects, pick, lang, setLang, onRender, fmtDate } from './assets/shared.js';

const COPY={
  ko:{
    kick:'AI Product Designer · EduPoly · Seoul',
    h1:'스스로 만들어 <i>증명하는</i> 디자이너.',
    lede:'교육 제품을 설계하고, 프로토타입은 직접 만들어 배포한다. 아래 화면은 목업이 아니라 실제 배포된 페이지를 그대로 캡처한 것이고, 누르면 그 주소로 열린다.',
    counts:[['배포','{n}'],['라이브','{live}'],['최근','{last}']],
    open:'열기', play:'PLAY', playHint:'실제 배포 화면', more:'제작 과정 상세', less:'상세 접기', pdf:'PDF로 저장',
    mPeriod:'기간', mCommits:'커밋', mRole:'역할',
    cIntent:'기획 의도', cConcept:'디자인 컨셉', cFlow:'흐름', cStack:'기술 스택', cDec:'설계 결정',
    outK:'Screens', onScreen:'이 화면에서',
    mDate:'Date', mTool:'Tool', mContrib:'Contribution',
    cAlso:'관련 저장소',
    phase:{plan:'기획',design:'디자인',build:'개발',qa:'검증'}, cFiles:'파일 구성',
    mTools:'AI 툴', mResp:'반응형', dev:{desktop:'데스크톱',tablet:'태블릿',mobile:'모바일'},
    tlH:'작업 타임라인', tlNote:'첫 커밋 – 마지막 커밋 · 프로젝트 {n}개',
    prinH:'같이 일할 때 알아두면 좋은 것들',
    prin:[
      ['AI는 초안을 늘리는 도구다','한 방향을 빨리 뽑으려고 쓰지 않는다. 같은 시간에 검토할 방향의 수를 늘리려고 쓴다. 고르는 일은 위임하지 않는다.'],
      ['판단이 필요하면 눌러볼 수 있게 만든다','정지 이미지는 클릭했을 때 뭐가 되는지 말해주지 못한다. 결정이 필요한 화면은 동작하는 프로토타입으로 회의에 올린다.'],
      ['토큰이 먼저, 화면은 그다음','대시보드 두 개가 브랜드만 바꿔 같은 뼈대를 재사용할 수 있었던 이유. 색과 타입이 화면이 아니라 토큰에 적혀 있었다.'],
      ['AI를 쓰지 않는 선을 정해둔다','최종 카피, 브랜드 판단, 접근성 검증은 직접 한다. 생성물이 90% 맞을 때 남은 10%를 알아보는 게 디자이너의 일이다.'],
    ],
    colophon:'이 사이트는 Claude Code로 만들었다. 처음 제안받은 기본값(Inter · 인디고 그래디언트 · 3단 카드 그리드)은 전부 버렸다. 프로젝트 목록과 썸네일은 GitHub Actions가 매일 자동으로 다시 채운다.',
  },
  en:{
    kick:'AI Product Designer · EduPoly · Seoul',
    h1:'A designer who <i>proves it</i> by building it.',
    lede:'I design education products and build the prototypes myself. These are screenshots of pages actually deployed — not mockups. Click one and it opens.',
    counts:[['Shipped','{n}'],['Live','{live}'],['Latest','{last}']],
    open:'Open', play:'PLAY', playHint:'Live deployment', more:'Full process', less:'Collapse', pdf:'Save as PDF',
    mPeriod:'Period', mCommits:'Commits', mRole:'Role',
    cIntent:'Intent', cConcept:'Design concept', cFlow:'Flow', cStack:'Stack', cDec:'Decisions',
    outK:'Screens', onScreen:'This screen',
    mDate:'Date', mTool:'Tool', mContrib:'Contribution',
    cAlso:'Related repositories',
    phase:{plan:'Planning',design:'Design',build:'Build',qa:'QA'}, cFiles:'Codebase',
    mTools:'AI tools', mResp:'Responsive', dev:{desktop:'Desktop',tablet:'Tablet',mobile:'Mobile'},
    tlH:'Timeline', tlNote:'first – last commit · {n} projects',
    prinH:'Worth knowing before we work together',
    prin:[
      ['AI widens the draft, not the shortcut','I don\'t use it to reach one direction faster. I use it to review more directions in the same hour. Choosing is never delegated.'],
      ['If it needs a decision, make it pressable','A still image can\'t answer what happens on click. Decision-bearing screens enter the room as working prototypes.'],
      ['Tokens first, screens second','Why two dashboards reused one skeleton across brands: color and type lived in tokens, not in the screens.'],
      ['Know where AI stops','Final copy, brand judgment and accessibility checks stay manual. When a generation is 90% right, catching the last 10% is the job.'],
    ],
    colophon:'Built with Claude Code. Its first defaults — Inter, an indigo gradient, a three-card grid — were all discarded. The project list and thumbnails are refilled daily by GitHub Actions.',
  }
};
let DATA=null;

function draw(){
  const L=lang(),c=COPY[L];
  document.documentElement.lang=L;
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===L)));
  kick.textContent=c.kick; h1.innerHTML=c.h1; lede.textContent=c.lede;

  const ps=DATA.projects.map(pick);
  const live=ps.filter(p=>p.live).length;
  const last=fmtDate(DATA.projects.map(p=>p.auto.pushed_at).sort().at(-1),L);
  counts.innerHTML=c.counts.map(([k,v])=>`<div><dt>${k}</dt><dd>${
    v.replace('{n}',ps.length).replace('{live}',live+'/'+ps.length).replace('{last}',last)}</dd></div>`).join('');

  // 관여도 — 분담 비율이 아니라 단계별 0~100 독립 게이지. 혼자 다 했으면 전부 100.
  const contribGauges=p=>{
    const cb=p.contribution; if(!cb) return '';
    const keys=['plan','design','build','qa'].filter(k=>cb[k]!=null);
    if(!keys.length) return '';
    return `<div class="cgrid">${keys.map(k=>`
      <span class="cg-l">${c.phase[k]}</span>
      <span class="cg-t" role="img" aria-label="${c.phase[k]} ${cb[k]}%"><i style="width:${cb[k]}%"></i></span>
      <b class="cg-v">${cb[k]}%</b>`).join('')}</div>`;
  };

  const desk=p=>p.shots.find(s=>s.device==='desktop')||p.shots[0];
  const side=p=>p.shots.find(s=>s.device==='mobile')||p.shots.find(s=>s.device==='tablet')||null;

  const esc=s=>String(s||'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

  const DEV_L={ko:{desktop:'데스크톱',tablet:'태블릿',mobile:'모바일'},
               en:{desktop:'Desktop',tablet:'Tablet',mobile:'Mobile'}};
  const gallery=p=>{
    const notes=p.shotNotes||{};
    const seen=new Set();
    const out=[];
    const primary=p.shots[0];
    if(primary){
      const n=notes[primary.device]||{};
      out.push({
        src:primary.src,
        device:primary.device,
        label:n.label||DEV_L[L][primary.device]||primary.device,
        note:n.note||p.concept||''
      });
      seen.add(primary.src);
    }
    for(const s of (p.scenes||[])){
      if(seen.has(s.src)) continue;
      out.push(s);
    }
    return out;
  };

  room.innerHTML=`<div class="pager gutter">
      <span class="count" id="pg-count"></span>
      <div class="dots" id="pg-dots" role="tablist" aria-label="프로젝트"></div>
      <div class="navb">
        <button type="button" id="pg-prev" aria-label="이전">←</button>
        <button type="button" id="pg-next" aria-label="다음">→</button>
      </div>
    </div>`+ps.map((p,i)=>{
      const d=desk(p), tab=p.shots.find(s=>s.device==='tablet'), mob=p.shots.find(s=>s.device==='mobile');
      const gal=gallery(p).slice(0,4);
      const fl=f=>L==='ko'?f.ko:(f.en||f.ko);
      return `<article class="show" id="p-${p.id}" data-i="${i}" ${i?'hidden':''}>
        <div class="splash gutter">
          <div class="fly">
            ${d?`<span class="frame d"><span class="shot"><img src="${d.src}" alt="${esc(p.title)}"
              ${i===0?'fetchpriority="high"':'loading="lazy"'} decoding="async"
              onerror="this.closest('.frame').remove()"></span></span>`:''}
            ${tab?`<span class="frame t"><span class="shot"><img src="${tab.src}" alt="" loading="lazy" decoding="async"
              onerror="this.closest('.frame').remove()"></span></span>`:''}
            ${mob?`<span class="frame m"><span class="shot"><img src="${mob.src}" alt="" loading="lazy" decoding="async"
              onerror="this.closest('.frame').remove()"></span></span>`:''}
          </div>
          <div class="copy">
            <p class="num">${String(i+1).padStart(2,'0')}.</p>
            ${p.kicker?`<p class="kick">${esc(p.kicker)}</p>`:''}
            <h2>${esc(p.title)}</h2>
            ${p.summary?`<p class="sum">${esc(p.summary)}</p>`:''}
            <a class="play" href="${p.live||p.repo}" target="_blank" rel="noopener">
              <b>${c.play}</b><span>← ${c.playHint}</span>
            </a>
            <dl class="facts">
              ${p.period?`<div><dt>${c.mDate}</dt><dd>${esc(p.period)}</dd></div>`:''}
              ${p.tools.length?`<div><dt>${c.mTools}</dt><dd>${esc(p.tools.join(' · '))}</dd></div>`:''}
              ${p.devices.length>1?`<div><dt>${c.mResp}</dt><dd>${esc(p.devices.map(k=>c.dev[k]||k).join(' · '))}</dd></div>`:''}
            </dl>
            ${contribGauges(p)?`<div class="contrib"><p class="k">${c.mContrib}</p>${contribGauges(p)}</div>`:''}
          </div>
        </div>
        <div class="board">
          <div class="gutter">
            <p class="k">${c.outK}</p>
            <div class="feats">${gal.map((s,si)=>`<figure>
              <span class="ph"><span class="shot${s.device==='mobile'?' is-portrait':''}"><img src="${s.src}" alt="${esc(s.label||p.title)}" loading="lazy" decoding="async"
                onerror="this.closest('figure').remove()"></span></span>
              <figcaption>
                <p class="k">${c.onScreen}</p>
                <b>${esc(s.label||s.device||'')}</b>
                ${s.note?`<span class="note">${esc(s.note)}</span>`:''}
                ${si===0&&p.flow.length?`<ol>${p.flow.slice(0,5).map(f=>
                  `<li><b>${esc(f.step)}</b><span>${esc(fl(f))}</span></li>`).join('')}</ol>`:''}
              </figcaption>
            </figure>`).join('')}</div>
            ${(p.intent||p.concept)?`<div class="brief">
              ${p.intent?`<div><h3>${c.cIntent}</h3><p>${esc(p.intent)}</p></div>`:''}
              ${p.concept?`<div><h3>${c.cConcept}</h3><p>${esc(p.concept)}</p></div>`:''}
            </div>`:''}
          </div>
        </div>
      </article>`;
    }).join('');

  const dots=document.getElementById('pg-dots');
  dots.innerHTML=ps.map((p,i)=>`<button type="button" role="tab" data-i="${i}"
    aria-label="${esc(p.title)}" ${i?'':'aria-current="true"'}></button>`).join('');
  let cur=0;
  const go=(n,scroll)=>{
    cur=Math.max(0,Math.min(ps.length-1,n));
    room.querySelectorAll('.show').forEach((el,i)=>el.hidden=i!==cur);
    dots.querySelectorAll('button').forEach((b,i)=>b.toggleAttribute('aria-current',i===cur));
    document.getElementById('pg-count').textContent=
      `${String(cur+1).padStart(2,'0')} / ${String(ps.length).padStart(2,'0')}`;
    document.getElementById('pg-prev').disabled=cur===0;
    document.getElementById('pg-next').disabled=cur===ps.length-1;
    history.replaceState(null,'','#'+ps[cur].id);
    if(scroll){
      const vis=room.querySelector('.show:not([hidden])');
      vis?.querySelector('.splash')?.scrollIntoView({block:'start'});
    }
  };
  document.getElementById('pg-prev').onclick=()=>go(cur-1,true);
  document.getElementById('pg-next').onclick=()=>go(cur+1,true);
  dots.onclick=e=>{const b=e.target.closest('button[data-i]'); if(b) go(+b.dataset.i,true);};
  const fromHash=()=>{
    const id=decodeURIComponent((location.hash||'').slice(1));
    const i=ps.findIndex(p=>p.id===id);
    go(i>=0?i:0, !!location.hash);
  };
  fromHash();
  window.addEventListener('hashchange',fromHash);

  // ── AI 가독성 레이어: 실제 데이터로 JSON-LD 채우기 ──
  const site='https://jinilee-hue.github.io/portfolio/';
  document.getElementById('ld-person').textContent=JSON.stringify({
    "@context":"https://schema.org","@type":"Person","name":"이진희","alternateName":"Jinhee Lee",
    "jobTitle":"AI Product Designer","worksFor":{"@type":"Organization","name":"EduPoly"},
    "url":site,"sameAs":["https://github.com/jinilee-hue"],
    "knowsAbout":["UI/UX Design","Design Systems","Design Tokens","Prototyping","Generative AI","EdTech"]
  });
  document.getElementById('ld-work').textContent=JSON.stringify({
    "@context":"https://schema.org","@type":"ItemList","name":"Selected work",
    "numberOfItems":ps.length,
    "itemListElement":ps.map((p,i)=>({"@type":"ListItem","position":i+1,
      "item":{"@type":"CreativeWork","name":p.title,"url":p.live||p.repo,
        "description":p.summary,"author":{"@type":"Person","name":"이진희"},
        "dateModified":p.pushed}}))
  });
  document.getElementById('prin-h').textContent=c.prinH;
  prin.innerHTML=c.prin.map(([h,b])=>`<article><h3>${h}</h3><p>${b}</p></article>`).join('');
  colophon.textContent=c.colophon;
}
onRender(draw);
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));

// PDF: 인쇄 대화상자에서 '대상 → PDF로 저장'. 접힌 케이스 스터디는 CSS 로 모두 펼쳐 인쇄된다.
document.getElementById('pdf').addEventListener('click',()=>window.print());
window.addEventListener('beforeprint',()=>{
  document.title = (lang()==='ko'?'이진희 포트폴리오 — ':'Jinhee Lee Portfolio — ')
    + new Date().toISOString().slice(0,10);
});
loadProjects().then(d=>{DATA=d;draw();}).catch(e=>{room.textContent='데이터 로드 실패: '+e.message;});
</script>
</body>
</html>

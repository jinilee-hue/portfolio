<!--
  15초 쇼릴 — 포트폴리오 첫 화면(intro.js)과 이력서용 MP4(?rec=1 프레임 촬영)가 같이 쓰는 원본.
  render(t) 는 순수 함수라 어떤 t 로 seek 해도 같은 화면이 나온다.

  모드  ?site=1   부모(intro.js)가 시계를 쥐고 __seek(t) 로 그린다. 창을 꽉 채우고(cover),
                  마지막 타격 직전에 벤 원과 한 줄 문장을 실제 히어로의 벤·리드 자리로 날려 보낸다.
                  바탕은 그동안 걷혀 히어로 사진이 비치고, 12.36s 에 부모가 이 문서를 걷어 낸다.
        ?rec=1    1920×1080 그대로, 끝 카드까지.
        (없음)    미리보기 — 창에 맞춰 반복, 클릭하면 전체화면.
        &lang=en  영문 카피.

  음악  bgm-ad 60.014s~70.514s + 203.396s~ (125.7 BPM, 박 P=0.4773s)
    0.00  자모 마크 조립 (8분음표마다 한 조각)
    1.91  히어로 사진 + 표제
    4.76  DROP — 작업 9개 비트 컷
    8.59  카메라 풀백 → 작업 벽 + 숫자
   10.50  벤다이어그램 + 한 줄 (음악 스플라이스)
   12.36  마지막 타격 — site: 실제 히어로로 착지 / rec: 마크 + 서명
-->

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const QS=new URLSearchParams(location.search);
const SITE=QS.has('site'), REC=QS.has('rec'), LANG=QS.get('lang')==='en'?'en':'ko';
document.documentElement.lang=LANG;
if(SITE)document.documentElement.classList.add('site');

const P=0.4773, B=k=>k*P;
const DROP=4.76, CEND=B(18), SPLICE=B(22), FLIP0=11.84, SLAM=12.36, DUR=15;
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,u)=>a+(b-a)*u;
const E={
  expoOut:u=>u>=1?1:1-Math.pow(2,-10*u),
  expoIn:u=>u<=0?0:Math.pow(2,10*(u-1)),
  expoInOut:u=>u<=0?0:u>=1?1:u<.5?Math.pow(2,20*u-10)/2:(2-Math.pow(2,-20*u+10))/2,
  backOut:(u,s=1.70158)=>1+(s+1)*Math.pow(u-1,3)+s*Math.pow(u-1,2),
  cubicInOut:u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2,
  sineInOut:u=>-(Math.cos(Math.PI*u)-1)/2,
};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,u)=>{const A=hex(a),C=hex(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,C[i],u))).join(',')})`};
const mixA=(a,b,u)=>a.map((v,i)=>lerp(v,b[i],u));
const rgba=a=>`rgba(${Math.round(a[0])},${Math.round(a[1])},${Math.round(a[2])},${a[3].toFixed(3)})`;
const vis=(el,on)=>{el.style.display=on?'':'none';return on};
const blur=v=>v>0.15?`blur(${v.toFixed(2)}px)`:'none';
const chunk=(s,cuts,u)=>{const n=u<=0?0:cuts[Math.min(cuts.length-1,Math.floor(u*cuts.length))];
  return `<span>${s.slice(0,n)}</span><span style="opacity:0">${s.slice(n)}</span>`};

/* ---------- 카피 (사이트 COPY·projects.json 의 kicker 와 같은 말) ---------- */
const COPY={
  ko:{h1:['스스로 만들어','<b class="em">증명하는</b>','디자이너.'],
    sub:['발음 연습 게임 · 음성 인식','AI Tutor 브랜드 · 캐릭터 · 64화면 프로토타입','5~7세 복합어 퍼즐 게임',
      '영어 학습 · 태블릿 프로토타입','7세 대상 AI 스토리 인클래스 수업','콘텐츠 등록부터 학생 화면까지 한 파이프라인',
      '학생 기자단 웹진','사내 배포 디자인 킷 · 두 브랜드','레거시 전면 개편 · 개발자 6명이 쓰는 킷'],
    live:'기획부터 프론트 개발까지', line:'기획부터 프론트 개발까지 디자이너가 *직접* 만든다.'},
  en:{h1:['A designer who','<b class="em">proves it</b>','by building it.'],
    sub:['Pronunciation game · speech recognition','AI tutor brand, character and a 64-screen prototype',
      'Compound word puzzle, ages 5–7','EFL reading · tablet prototype','An in-class AI story lesson for seven-year-olds',
      'One pipeline, from upload to the student’s screen','Student reporters’ web magazine',
      'In-house design kit · two brands','Legacy overhaul · a kit six developers build on'],
    live:'Planning through front end', line:'I take a product from planning through front-end development *myself.*'},
}[LANG];
$$('#S2 .ln>span').forEach((el,i)=>el.innerHTML=COPY.h1[i]);
$('#liveSub').textContent=COPY.live;
$('#vtext').innerHTML=COPY.line.split(' ').map(w=>w.startsWith('*')
  ?`<span class="w m">${w.replace(/\*/g,'')}</span>`:`<span class="w">${w}</span>`).join(' ');
const NAMES=['Sound Safari','LIO','Prompt Crash','Millions of Cats','Story Studio','Phonics Studio','Poly Scoop','Dashboard Kit','KCMS'];
const LAB=NAMES.map((n,i)=>[String(i+1).padStart(2,'0'),n,COPY.sub[i]]);

/* ---------- 작업 벽 타일 (가운데 = KCMS, 마지막 컷과 이어진다) ---------- */
const TILES=['t-Sound-Safari--tablet','t-AI-Studio--f6','t-LIO_DESIGN--game','t-eBOOK--cottage','t-Phonics-Playground--tablet',

  const s=SITE?Math.max(vw/1920,vh/1080):Math.min(vw/1920,vh/1080);

const cam=$('#cam'),flash=$('#flash'),grain=$('#grain'),gridEl=$('#grid'),bgEl=$('#bg'),vig=$('#vig');
const FL=[[DROP,0.8,0.18],[CEND,0.22,0.16],[SPLICE,0.3,0.18]].concat(SITE?[]:[[SLAM,0.9,0.26]]);
const SH=[[B(6),5],[DROP,16],[B(12),6],[CEND,9],[B(19),7],[B(20),5]].concat(SITE?[]:[[SLAM,18]]);
function gridOp(t){
  const a=E.expoOut(seg(t,0,0.9))*(1-E.expoIn(seg(t,B(4),B(4)+0.5)));
  const b=(t>=SPLICE&&t<SLAM)?E.expoOut(seg(t,SPLICE,SPLICE+0.3)):0;
  return Math.max(a,b,(!SITE&&t>=SLAM)?0.8:0);
}
function rFX(t){
  let f=0;FL.forEach(([t0,a,d])=>{if(t>=t0&&t<t0+d)f=Math.max(f,a*(1-E.expoOut(seg(t,t0,t0+d))))});
  flash.style.opacity=f.toFixed(3);
  let x=0,y=0;SH.forEach(([t0,a],k)=>{if(t>=t0&&t<t0+0.6){const d=t-t0,env=a*Math.exp(-d*11);
    x+=env*Math.sin(d*2*Math.PI*19+k);y+=0.6*env*Math.cos(d*2*Math.PI*23+k*1.7)}});
  cam.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(1.03)`;
  const fi=Math.floor(t*24);grain.style.backgroundPosition=`${(fi*7919)%512}px ${(fi*104729)%512}px`;
  // 사이트: 날아가는 동안 바탕을 걷어 아래의 실제 히어로 사진이 비치게 한다
  const dis=SITE?E.sineInOut(seg(t,11.95,SLAM)):0;
  bgEl.style.opacity=(1-dis).toFixed(3);
  vig.style.opacity=(1-dis).toFixed(3);
  grain.style.opacity=(0.075*(1-dis)).toFixed(4);
  gridEl.style.opacity=(gridOp(t)*(1-dis)).toFixed(3);
}
function makeGrain(){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d'),im=g.createImageData(512,512);
  let s=1234567;const rnd=()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%1000)/1000};
  for(let i=0;i<im.data.length;i+=4){const v=Math.floor(rnd()*255);im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}
  g.putImageData(im,0,0);grain.style.backgroundImage=`url(${c.toDataURL()})`}

function render(t){rMark(t);rS1(t);rS2(t);rS3(t);rS4(t);rStats(t);rS5(t);rS6(t);rFX(t)}
window.__seek=t=>render(t);
window.__dur=DUR;

(async function boot(){
  makeGrain();
  const strip=s=>s.replace(/<[^>]+>|\*/g,'');
  try{await Promise.all([
    document.fonts.load('700 134px "Pretendard Variable"',COPY.h1.map(strip).join(' ')),
    document.fonts.load('900 68px "Pretendard Variable"','ㅇㅈㄴㅎ'),
    document.fonts.load('650 54px "Pretendard Variable"',strip(COPY.line)),
    document.fonts.load('600 25px "Pretendard Variable"',COPY.sub.join(' ')+COPY.live),
    document.fonts.load('700 200px "Reel Caveat"','Jinhee Lee'),
    document.fonts.load('800 78px "Reel Archivo"','SOUND SAFARI PROMPT CRASH 1,243 LIVE PROJECTS COMMITS PLANNING DESIGN BUILD QA'),
  ])}catch(e){console.warn('font preload',e)}
  await document.fonts.ready;
  await Promise.all($$('img').map(i=>i.decode().catch(()=>{})));
  // layout 은 무대가 축소되기 전에 잰다 (서명 기준선을 getBoundingClientRect 로 재기 때문)
  layout();fit();render(0);
  addEventListener('resize',fit);
  window.__ready=true;
  if(!SITE&&!REC){
    // 미리보기 — 음악과 함께 반복. 자동재생이 막히면 클릭(전체화면)할 때 소리가 붙는다.
    const au=new Audio('reel.mp3');au.preload='auto';
    let t0=null;
    const go=()=>{t0=null;au.currentTime=0;au.play().catch(()=>{})};
    addEventListener('click',()=>{const d=document.documentElement;
      Promise.resolve((d.requestFullscreen||d.webkitRequestFullscreen)?.call(d)).catch(()=>{});go()});
    const loop=now=>{if(t0===null)t0=now;let t=(now-t0)/1000;
      if(!au.paused&&au.readyState>=2){const d=au.currentTime-t;if(Math.abs(d)>0.08){t0-=d*1000;t=au.currentTime}}
      if(t>=DUR){t0=now;t=0;if(!au.paused)au.currentTime=0}
      render(t);requestAnimationFrame(loop)};
    go();requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
